- id: sidebar-v2-row-action-hit-area
  intent: >
    This entry owns the size AND the placement of the Sidebar V2 row hover
    actions; the id predates the alignment half.

    Every Sidebar V2 row hover action — pin/unpin, snooze, settle, un-settle,
    wake now — is a 24px square with a hover fill. Pin leads the card's hover
    cell, ahead of snooze (Noey's placement); it is capability-gated like
    settle/snooze, card-only (slim rows keep pin in the context menu), and
    toggles between two literal labels so the guard's census counts each.
    Upstream sizes them from padding around a
    12px glyph, which lands at 24x18 on a card and 28x18 on a slim row: two
    different shapes, both under the 24px minimum, on transparent buttons whose
    edges you cannot see. On an icon-only control the box is the whole target,
    so undersizing it and hiding it are the same bug twice.

    All of them share SIDEBAR_V2_ICON_BUTTON_CLASS, which is the point: they appear
    in two row variants, three branches of one ternary and a project header, and
    the previous drift between them is exactly what a per-call-site class string
    produces. The three slim-row branches share one placement constant on top of
    it — they are one control, and three copies is how the set came apart the
    first time. Every offset below is derived in custom/sidebarV2TrailingColumn
    with the arithmetic that produced it; call sites name the one meant for them
    rather than spelling a value out.

    24px is the visual box; on a coarse pointer an invisible child grows it to
    44px, the trick ui/button and the chrome rows' trailing buttons already use.
    The row actions are hover-gated and never reach a touch device, but the
    project header's plus is always rendered and its handler closes the mobile
    drawer, so it does — and 24px is the WCAG 2.5.8 floor exactly. That floor
    is a design-wide stance: the Figma chrome draws every icon-only control,
    the always-on trailing buttons included, at the same 24px box. The class
    also carries focus-visible, for the reason the hover fill exists: on a
    transparent button you cannot see where the target ends, and that is as
    true of keyboard focus as of the pointer. Its ring offset is 1, not the
    chrome buttons' 2: these buttons sit inside the row surface's
    overflow-hidden with their edge 4px from the clip boundary, and
    ring-2 + offset-2 is exactly 4px of shadow — the ring rendered clipped.
    offset-1 keeps the full ring with 1px to spare.

    The fill is bg-foreground/10, not bg-accent. These sit on top of the row's
    own hover fill (--sidebar-row-hover), and a foreground alpha is the one
    value that stays a step brighter than the row beneath it in dark and a step
    darker in light.

    The card's trailing cell is h-6 rather than the title line's h-4 —
    a 24px target cannot fit a 16px cell. It is centred in the 16px line, so it
    overhangs 4px into the card's py-2 above and its gap-2 below, neither of
    which carries anything to collide with. Status no longer shares this cell —
    it leads the title line — so the opacity-crossfade hit-path bug that used to
    eat settle clicks (an opacity-0 status span stacking above the actions)
    cannot return; elapsed time is the only decoration that still fades here,
    and it is pointer-events-none.

    Placement: every trailing mark down the sidebar shares one vertical axis,
    24px in from the panel's content edge — the chrome rows' pe-3 plus half
    their 24px button. The rows do not share a right edge: chrome ends 12px
    in, the list rows 8. A card's own px-1 closes that gap, so its flush 24px
    action cell and its runtime glyph are on the axis as drawn; the project
    header and the slim rows' right-0 overlay sit on the bare 8px edge and
    spend me-1 to get back; the shelf chevrons' px-2.5 centres their 12px
    glyph on the axis by itself. Boxes give up their edges; glyphs keep the
    axis, which is the thing anyone actually reads. (An earlier derivation
    assumed the list and chrome columns end at the same place — 4px wrong at
    the source, and every offset inherited it.)

    The chrome inset carries no scrollbar term. It used to carry the thread
    list's scroll gutter too; fork-sidebar-chrome now compensates for that
    gutter in the list's own end padding, so a scrollbar term reappearing here
    would double-count it and walk both icons back off the column.

    Upstream v0.0.30 reworked its own card's status slot toward the same goal
    (an absolute actions overlay with focus-within:static and a min-w-8 slot)
    and put the "Settle" text label back on the card action. Both were
    declined at the sync: the fork's shared-grid-cell already solves the
    overlap upstream was chasing — the cell is as wide as whichever state is
    showing, so the title truncates against the real width — and the text
    label is what this entry removed in the first place (at 282px it pushed
    the actions over the title, which now shares their line). A sync that
    reintroduces either is resolving the conflict backwards. Upstream's
    matching restyle of sidebarMenuButtonVariants ([&>svg] muted at
    opacity-60) was kept for upstream surfaces but is displaced on the fork's
    chrome rows, whose buttons re-assert the /80 tint at full opacity —
    parent-level [&>svg] outweighs the icon's own class, so without that the
    fork tint is silently dead and the duotone glyphs double-fade.
