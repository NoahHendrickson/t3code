- id: fork-lint-cleanliness
  intent: >
    Fork-owned code carries zero lint warnings, and CI fails on the first one.
    Nothing in this repository otherwise gates on a warning: vp check lints
    everything but exits 0, and no --max-warnings is set anywhere, so warnings
    in fork-authored files accumulate in silence.
    The gate is scoped to fork-owned paths on purpose rather than being a
    repo-wide --max-warnings count. A repo-wide count ratchets against
    upstream: the first sync that lands an upstream warning turns the build
    red for code this fork cannot fix, and the only available response is to
    raise the number. Scoped, upstream can add as many warnings as it likes
    and this stays green because it never looks there; the upstream warnings
    present when this landed are deliberately untouched.
    Scope has three parts, filtered to .ts/.tsx/.mjs because files: also lists
    images, CSS, YAML and shell. First, the fork-owned directories, including
    .fork and apps/web/fork. Second, every lintable files: entry in this
    manifest. Third, an explicit list of upstream-path files the fork has
    edited enough to own their lint output — the part that matters most,
    because the fork's largest authored surface is hunks inside files at
    upstream paths, and a file-level scope cannot express "the fork owns these
    lines but not this file". Adoption is not free: an upstream-authored
    warning in an adopted file turns the build red, accepted only for files
    the fork already maintains hunks in and would have to act on anyway.
    ThreadTerminalDrawer.tsx is deliberately excluded despite carrying fork
    fences, because its one warning is an unused eslint-disable on upstream's
    line, under upstream's rule config — no fork change can clear it. Fenced
    hunks in any other upstream file remain uncovered until adopted by name;
    that gap is real and stated rather than papered over.
    The gate compares oxlint's number_of_files against the count it passed in,
    which is what keeps it honest: an explicitly-passed path matching
    lint.ignorePatterns is skipped silently, so without that comparison a fork
    path landing in an ignore list would produce a green run that inspected
    nothing. It also passes --report-unused-disable-directives, matching the
    repo's own lint script, so the gate is never weaker than the lint it
    claims to enforce.
    The guard test deliberately does not run the lint. It asserts the path
    selection and the CI wiring, because selection is the half that fails
    quietly — a gate pointed at the wrong paths still exits 0 — and it checks
    selection by walking the tree independently, not by spot-checks.
    The motivating incident (nine dead imports surviving three PRs in
    Sidebar.tsx) is in .fork/notes/FORK-CUSTOMIZATION-DECISIONS.md.
  tier: 1
  files:
    - .fork/lint-owned.mjs
  shadows: []
  watch:
    # Carries the fenced step that runs the gate.
    - .github/workflows/ci.yml
    # lint.ignorePatterns lives here. An upstream addition that happens to
    # match a fork-owned path would silently narrow the gate; the file-count
    # check turns that into a failure, and this entry makes the change visible
    # to the drift detector in the first place.
    - vite.config.ts
  verify:
    - apps/web/src/__fork_guards__/forkLintCleanliness.test.ts

- id: fork-composer-shell
  intent: >
    The chat composer is one outer 8px vessel that wraps the prompt surface and
    the control row, with context chips sitting 8px above the vessel. One
    compact base layout in every thread state, including a brand-new draft.
    ChatView always docks it to the bottom instead of centering it as a
    new-chat hero. The empty-draft greeting ("What should we build…") is a
    separate absolute layer centered in the chat column, not stacked above the
    docked input. BranchToolbar renders upstream's ComposerSurface.ContextStrip
    untouched (the liveness fallback strip mounts the same component); the
    context-row CSS flatten, keyed on its data-slot, is the single owner of
    the strip geometry (width/margin/padding resets, unlayered so they beat
    the Tailwind utilities) so the chips share the composer's max-w-3xl rail
    instead of the old under-glass inset. The prompt surface is 44px tall at rest: 10px
    block and 8px inline padding (px-2 py-2.5) around a
    one-line prompt and the 24px send/stop button. The prompt and action remain
    in that same row as text wraps — the action pinned bottom-right so it stays
    with the last line — so the surface grows naturally with the editor; there
    is no tall/slim density switch, resize observer, or wrap latch. Upstream's
    collapsed mobile tap target remains a separate functional state.

    Which controls sit where is the main design contract. BranchToolbar's
    worktree, PR, and branch chips sit above the vessel as filled chips
    sharing one selected-surface fill with no hairline, 8px apart (matching
    the context row's pb-2 under the pills — including the nested PR+branch
    pair that upstream keeps at gap-1). When a settled turn still has
    background liveness (monitoring watch or working fleets), a pill (leading
    mark + label + small stop square) sits immediately after the branch pill
    via BranchToolbar's optional trailing slot — not in the ComposerBannerStack.
    Working uses the sidebar pixel-rain mark; monitoring uses the duty-cycled
    white pulse. Labels stay short for the chip: Monitoring, N agent(s), or
    Working.
    Upstream's strip children use flex-1
    and the branch's justify-end / md:ml-auto, which opens a large empty gap
    between checkout and branch at narrower widths while the checkout label
    truncates; the fork forces those direct flex children to flex 0 1 auto,
    justify-content flex-start, and margin-inline-start 0 so the chips stay a
    packed leading cluster. The strip itself still spans the row (flex-1,
    min-width 0) rather than shrinking to its chips: upstream collapses the
    chip labels to icons by comparing the width they need against the strip's
    own clientWidth, and a shrink-to-fit strip measures its collapsed self, so
    one compact pass would latch the chips icon-only for good. Because a strip
    that spans the row has free space to hand out, the flex-1 neutralization
    covers every direct child rather than only the ones carrying `.flex` —
    below `md` the workspace slot is an inline-flex Button or span, and left to
    upstream's flex-1 it would claim that space and gap the cluster open.
    Chips use 8px inline padding (24px tall, 6px radius) at 12px type matching
    the mode row's Auto/Build pills, and the workspace chip's trigger caret is
    dropped. The folder glyph sits flush in its 12px frame, so that start
    padding is real — not the old optical 0 that left Current checkout tight
    on the pill edge. The workspace select opens above the chip row (side top,
    no align-item-with-trigger) so its glass menu clears the neighboring
    branch pill instead of overlapping it. Only the prompt and primary action sit
    inside the prompt surface. Runtime and interaction modes sit below-left
    inside the vessel; context usage, model, and effort sit below-right in a
    control row with 8px padding — 36px tall over the 20px ghost controls,
    40px whenever the 24px context-usage meter renders (4px-radius controls —
    Noey's radius over the drawn full-pill ghosts, so hover fills square
    off). The
    runtime mode renders as the design's 20px accent chip — label only, no
    icon or caret — with its hue selected by a typed fork-owned token map:
    auto green, full access yellow, auto-accept edits purple, supervised red.
    The interaction toggles are text-only ghost chips. Mode,
    Build, model, and effort all share 12px medium on a 16px line and 4px
    inline padding (including the runtime-mode chip). They also share one hover
    channel — a faint white 4% wash in dark (`--fork-composer-control-hover`),
    not upstream's ghost `--accent`, which the Cool palettes resolve to the
    composer's own prompt-surface fill, and not the context chips' raised lift,
    which read nearly solid on these text-only ghosts. The runtime-mode chip is
    the one opt-out; its hover is a per-mode hue. The composer's effort
    trigger joins its trait labels with a plain space ("High 1M") while
    Settings keeps upstream's " · " separator. Geometry is CSS-owned:
    theme.custom.css styles every ghost control under the mode and model
    groups — the mode chip included, so geometry has exactly one owner —
    while ComposerShell.css carries only the chip's per-mode fill and ink.
    Both are imported unlayered while Tailwind's utilities live in `@layer
    utilities`.
    Unlayered beats layered regardless of specificity, so a `px-*` class
    passed at a call site cannot move these controls at all — not upstream's
    px-2.5.
    The branch strip is still passed into ChatComposer as
    the memoised contextStrip element, preserving ChatComposer's memo boundary
    and keeping branch controls reachable while mobile is collapsed. It also
    stays mounted whenever the thread holds a worktree path, rather than only
    when the status cwd reports a git repo: a worktree whose directory has been
    deleted answers not-a-repo for itself, and hiding the strip on that answer
    took away the workspace chip — the control a draft uses to point itself
    back out of the dead tree, and its only way out. A started thread's
    workspace is pinned either way, so its strip returns read-only. Runtime,
    model, and effort controls remain gated during a pending approval, while
    the mobile composer is collapsed, and while the mobile pending-answer
    cluster is visible (upstream hides its footer there too, since the editor
    reserves that band for the absolute prev/advance actions); the read-only
