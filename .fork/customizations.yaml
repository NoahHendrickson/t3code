- id: fork-lint-cleanliness
  intent: >
    Fork-owned code carries zero lint warnings, and CI fails on the first one.
    Nothing in this repository otherwise gates on a warning: vp check lints
    everything but exits 0, and no --max-warnings is set anywhere, so warnings
    in fork-authored files accumulate in silence.
    The gate is scoped to fork-owned paths on purpose rather than being a
    repo-wide --max-warnings count. A repo-wide count ratchets against
    upstream: the first sync that lands an upstream warning turns the build
    red for code this fork cannot fix, and the only available response is to
    raise the number. Scoped, upstream can add as many warnings as it likes
    and this stays green because it never looks there; the upstream warnings
    present when this landed are deliberately untouched.
    Scope has three parts, filtered to .ts/.tsx/.mjs because files: also lists
    images, CSS, YAML and shell. First, the fork-owned directories, including
    .fork and apps/web/fork. Second, every lintable files: entry in this
    manifest. Third, an explicit list of upstream-path files the fork has
    edited enough to own their lint output — the part that matters most,
    because the fork's largest authored surface is hunks inside files at
    upstream paths, and a file-level scope cannot express "the fork owns these
    lines but not this file". Adoption is not free: an upstream-authored
    warning in an adopted file turns the build red, accepted only for files
    the fork already maintains hunks in and would have to act on anyway.
    ThreadTerminalDrawer.tsx is deliberately excluded despite carrying fork
    fences, because its one warning is an unused eslint-disable on upstream's
    line, under upstream's rule config — no fork change can clear it. Fenced
    hunks in any other upstream file remain uncovered until adopted by name;
    that gap is real and stated rather than papered over.
    The gate compares oxlint's number_of_files against the count it passed in,
    which is what keeps it honest: an explicitly-passed path matching
    lint.ignorePatterns is skipped silently, so without that comparison a fork
    path landing in an ignore list would produce a green run that inspected
    nothing. It also passes --report-unused-disable-directives, matching the
    repo's own lint script, so the gate is never weaker than the lint it
    claims to enforce.
    The guard test deliberately does not run the lint. It asserts the path
    selection and the CI wiring, because selection is the half that fails
    quietly — a gate pointed at the wrong paths still exits 0 — and it checks
    selection by walking the tree independently, not by spot-checks.
    The motivating incident (nine dead imports surviving three PRs in
    SidebarV2.tsx) is in .fork/notes/FORK-CUSTOMIZATION-DECISIONS.md.
  tier: 1
  files:
    - .fork/lint-owned.mjs
  shadows: []
  watch:
    # Carries the fenced step that runs the gate.
    - .github/workflows/ci.yml
    # lint.ignorePatterns lives here. An upstream addition that happens to
    # match a fork-owned path would silently narrow the gate; the file-count
    # check turns that into a failure, and this entry makes the change visible
    # to the drift detector in the first place.
    - vite.config.ts
  verify:
    - apps/web/src/__fork_guards__/forkLintCleanliness.test.ts

- id: fork-composer-shell
  intent: >
    The chat composer is a discrete 8px bordered surface with one compact base
    layout in every thread state, including a brand-new draft. ChatView always
    docks it to the bottom instead of centering it as a new-chat hero. The
    empty-draft greeting ("What should we build…") is a separate absolute layer
    centered in the chat column, not stacked above the docked input. The base
    row is 40px tall: 8px padding around a one-line prompt and the 24px
    send/stop button. The prompt and action remain in that same row as text
    wraps — the action pinned bottom-right so it stays with the last line —
    so the surface grows naturally with the editor; there is no tall/slim
    density switch, resize observer, or wrap latch. Upstream's collapsed mobile tap
    target remains a separate functional state.

    Which controls sit where is the main design contract. BranchToolbar's
    worktree, PR, and branch chips sit above the surface as filled chips
    sharing one selected-surface fill with no hairline, 8px apart (matching
    the context row's pb-2 under the pills — including the nested PR+branch
    pair that upstream keeps at gap-1). Upstream's strip children use flex-1
    and the branch's justify-end / md:ml-auto, which opens a large empty gap
    between checkout and branch at narrower widths while the checkout label
    truncates; the fork forces those direct flex children to flex 0 1 auto,
    justify-content flex-start, and margin-inline-start 0 so the chips stay a
    packed leading cluster. Chips use the Auto chip's container at
    4px/6px inline padding (24px tall, 6px radius — extra 2px on the end so
    the trailing chevron clears the curve; branch combobox takes 6px start,
    workspace select 0 for its roomier folder glyph) at 12px type matching
    the control row's ghost pills, and the workspace chip's trigger caret is
    dropped. The workspace select opens above the chip row (side top, no
    align-item-with-trigger) so its glass menu clears the neighboring branch
    pill instead of overlapping it. Only the prompt and primary action sit
    inside the base row. Runtime and interaction modes sit below-left;
    context usage, model, and effort sit below-right in a 24px control row of
    20px, 4px-radius controls (Noey's radius over the drawn full-pill ghosts,
    so hover fills square off). The runtime mode renders as the design's 20px
    accent chip — label only, no icon or caret — with its hue selected by a
    typed fork-owned token map: auto green, full access yellow, auto-accept
    edits purple, supervised red. The interaction and plan-sidebar toggles
    are text-only ghost chips,
    the model and effort selects share the row's 12px type (Noey's call over
    the drawn 10px), and the composer's effort trigger joins its trait labels
    with a plain space ("High 1M") while Settings keeps upstream's " · "
    separator. The branch strip is still passed into ChatComposer as
    the memoised contextStrip element, preserving ChatComposer's memo boundary
    and keeping branch controls reachable while mobile is collapsed. Runtime,
    model, and effort controls remain gated during a pending approval and while
    the mobile composer is collapsed; the read-only context meter may remain.
    The inline primary-action cluster is suppressed whenever the mobile
    pending-answer cluster is visible, so only one answer action renders.

    Upstream's stitched glass-shell paint is disabled under the fork marker.
    The docked composer overlay paints an opaque page-colored floor (soft fade
    over its top edge) so timeline rows cannot read through the floating
    control row once that vessel is gone. The prompt surface keeps its own
    translucent fill, inset hairline, focus-border recolour, backdrop blur,
    and explicit drag-over outline.
    BranchToolbar's stitched-strip spacing is flattened in the named context
    row. Send and stop remain 24px square at 4px radius; dark builds without
    stage-channel art use a flat white send button with a black icon, while
    Dev and Nightly retain their channel fill. Existing project components
    supply all icons and controls; no Figma-exported assets are committed.

    Type follows the design system's dark tokens: the prompt is body/md — 14px
    on a 23px line at >=40rem with a full muted-foreground placeholder (16px
    mobile type stays, avoiding iOS focus zoom) — and the ghost controls and
    mode chip are 12px medium on 16px with 12px glyphs. The prompt wrapper
    owns the 12.5rem scroll cap so a one-line Lexical editor never paints a
    phantom scrollbar, and the placeholder/spacer overflow containment remains
    in place.     Attachment and pending-state content may add height above the
    base row, but ordinary composer height changes only when prompt content
    wraps. Pill styling stays narrowly scoped so pending-state primary actions
    retain their upstream geometry.

    Compact ⋯ collapse for the below-surface mode row uses fork-lowered
    form-width thresholds (400px normal / 520px with wide primary actions),
    not upstream's 620/780. Upstream's numbers pack denser in-box footers;
    here mode chips sit opposite the model picker on a dedicated row, so
    those thresholds hide Full access / Build / Plan behind ⋯ while a large
    empty gap remains. The wide-actions threshold must stay under the form's
    max-w-3xl (768px) or the expanded row can never appear in that state.
    Mode-row collapse and model-picker compaction are deliberately split:
    the override drives only ⋯ vs ComposerFooterModeControls; the model
    trigger keeps upstream's 620/780 via composerModelSlotCompact.ts so the
    right slot does not grow in the newly expanded 400–620 band. Traits stay
    gated with the mode row (inline when expanded, CompactComposerControlsMenu
    when collapsed) so they are never stranded between the two thresholds.
  tier: 4
