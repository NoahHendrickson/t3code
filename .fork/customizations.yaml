- id: phosphor-duotone-icons
  intent: >
    The app's iconography is Phosphor at the duotone weight, not lucide.
    Rather than rewriting ~89 import sites across the hottest upstream files
    (ChatView, SidebarV2, ChatComposer), "lucide-react" is aliased to a
    fork-owned shim that re-exports Phosphor under lucide's export names. Call
    sites keep importing "lucide-react" verbatim, so upstream can add, move, or
    delete icon usage freely and this fork inherits it. Glyphs with no enclosed
    area (carets, checks, arrows, spinners) are pinned to the bold weight,
    since duotone is indistinguishable there and reads too light against
    lucide's 2px stroke. The shim also reproduces lucide's `lucide lucide-<name>`
    SVG classes, because upstream tests assert them to identify which icon
    rendered — honouring the contract keeps those tests passing unmodified
    instead of forcing Tier 4 edits into upstream test files.
  tier: 1
  files:
    - apps/web/src/custom/icons/lucide-phosphor.tsx
  shadows: []
  watch:
    - apps/web/vite.config.ts
    - apps/web/tsconfig.json
  verify:
    - apps/web/src/__fork_guards__/phosphorIcons.test.ts

- id: sidebar-v2-card-rows
  intent: >
    Sidebar V2 thread rows are three-line cards at 8px radius: a title line, a
    repo line (project plus branch), and a meta line whose two halves sit in
    fixed corners — PR number and diff counts on the left, model label and
    runtime glyph on the right. Splitting repo from meta is the point: the two
    things you compare across rows, what a thread is and how big it got, are
    then always at the same x. Upstream's terminal-status glyph (#4712) rides
    the repo line after the branch cluster, handed in pre-built as a required
    `terminalSlot` — required like `prSlot`, so a sync resolution that drops
    the call-site line fails the typecheck instead of silently un-porting the
    feature from the card variant.

    Surface encodes interaction and nothing else. A row is filled on hover and
    when selected or routed to; it is never filled because of its status.
    Done and Idle recede their title colour at rest (restored on hover or
    selection), per the component set — Working, Approval, Input and Failed
    keep the foreground title. Every title is Regular at 0.875rem (14px);
    colour alone carries the receded/forward distinction, which is why
    receded titles use --fork-sidebar-card-title-receded (#c0c0c0) rather
    than lifting the shared --muted-foreground channel (see
    fork-surface-palette). The size is literal on threadCardTitleClassName so
    the panel's --text-xs/--text-sm remap to 13px cannot shrink it. The repo
    line (project + branch) is 0.75rem (12px) for the same reason. A card's
    surface reads the same Done/Idle predicate as its title (`cardRecedes`);
    upstream's shouldRecede survives for the slim shelves only, where
    brightness still encodes unread-ness — the card delegates unread to the
    Done dot.

    Status text labels ("Working", "Approval") are replaced by a single 14px
    mark in a fixed leading slot on the title line, and the slot is never empty
    — idle draws a hollow ring rather than falling back to a variable-width
    relative-time string, so the title text and the rows below share one left
    edge. Repo and meta rows indent 24px (the mark's 14 plus the title gap's
    10) so they align under the prompt rather than under the mark. The mark's
    form carries the state — falling pixels while the agent runs, a static
    dot once it stops, a clock for woke, a ring for idle — and the hue only
    reinforces it. Working is emerald, deliberately diverging from the sky
    the mobile Live Activity still uses; mobile has not been migrated.

    Working duration and the hover actions stay on the title line's trailing
    cell. Status no longer shares that cell, so the opacity-crossfade hit-path
    bug that used to eat settle clicks cannot return.

    Card metrics from Figma t3-fork node 113:3718: px-4 py-8 (4/8). The
    title line (status + prompt) is 14px — status slot, rain, and title
    leading all share that height; at 16px the rain read as hanging below
    the prompt. Repo line stays 16px. Title-to-status gap is 10px
    (gap-2.5) so 14+10 keeps the prompt lined up with the group header
    label (24px folder + 4px gap); repo/meta indent 24px. Drawn card
    heights are 54 / 77. Row gap is 8px (gap-2), not Figma's 4.
    Cards sit 4px apart — the list ul's gap-1 (fork retune of Figma's 2px /
    gap-0.5, for breathing room on the lifted panel); the li itself carries
    no padding. List pad 8 puts the leading status at 12px — the same axis as
    Search and the group folder icon. contain-intrinsic-size is 54 / 77 —
    the drawn card exactly (same as the heights above). Branch and runtime
    glyphs are 14px; the runtime mark sits in a 24px box flush with the
    card edge so it shares the settle/discard centre on the trailing axis
    (a lone 14px + pr-[3px] was 2px off once actions grew to size-6). The
    model label is caption 11/15 on either line it lands on. The
    branch/worktree cluster (mark plus name) reads at text-foreground/70 —
    closer to the title than the surrounding muted-foreground/70 meta —
    so the checkout stays legible without matching the prompt.

    A card is three lines only when it has a PR or a diff for the third, or does
    not yet know whether it has a PR; with a known-empty third line the model and
    runtime move up beside the branch and the card closes at two lines. The
    unknown case matters as much as the empty one: whether a thread has a PR is
    the answer to a per-row VCS query, and collapsing before it lands would grow
    every PR card 15px mid-scroll as the queries resolve. Nothing else varies the
    height: an absent branch or model leaves its half of a row empty rather than
    closing the row up. The li's contain-intrinsic-size is chosen by the same
    predicate the component renders from, so it can never claim a height the row
    does not have, and it measures the li — which carries no padding of its own,
    so the hints equal the drawn heights of 54 and 77. Retune the card's
    vertical padding or row gap and both hints move with it, or the scrollbar
    misreports every skipped row by the difference.

    A thread that runs in a worktree of its own draws a worktree mark where the
    branch mark otherwise goes — replacing it, not joining it. That slot already
    answers "which code is this on", and the two facts are not independent: a
    thread on a worktree is on that worktree's branch, so a second glyph would
    spend ~14px of a line whose branch name is already capped and truncating to
    restate what the first implies. The predicate is the one the row's own git
    cwd and env mode come from, so the mark cannot claim a worktree the rest of
    the row is not treating as one, and the worktree case carries a `sr-only`
    label because both marks are decorative to a screen reader.

    The mark is fork-drawn (Figma t3-fork, node 86:6226), not Phosphor: nothing
    in that set says "this thread has a checkout of its own", and the nearest
    candidates are folders, which on this line read as the project. It is a 32
    viewBox at stroke 2 with its two outer nodes at 20% — Phosphor's 256-at-16
    ratio and duotone convention — so it matches the weight of the set around it
    at any size. Retune the viewBox without the stroke and it stops. The Figma
    export's #1E1E1E artboard and clip path are dropped and every paint is
    currentColor; shipping either literal gives a dark square in light mode.

    Diff counts bind to --success-foreground / --destructive-foreground rather
    than emerald/red literals, so they hold up in light mode. They render only
    once latestTurnDiff() returns data: it is an upstream stub returning null
    today, and the slot is built to light up when the shell projection grows
    checkpoint summaries.

    The status palette and the rain keyframes live in the Tier 1 stylesheet;
    only the five --color-sidebar-v2-status-* utility registrations sit inline
    in index.css, because Tailwind reads utility names from the @theme block
    alone and will not see them anywhere else.
  tier: 4
  files:
    - apps/web/src/custom/SidebarV2StatusIndicator.tsx
    - apps/web/src/custom/SidebarV2ThreadCardMeta.tsx
    - apps/web/src/custom/icons/WorktreeIcon.tsx
    - apps/web/src/custom/sidebarV2RowPolicy.ts
    - apps/web/src/theme.custom.css
  shadows: []
  watch:
    - apps/web/src/components/SidebarV2.tsx
    - apps/web/src/index.css
  verify:
    - apps/web/src/__fork_guards__/sidebarV2Rain.test.ts
    - apps/web/src/__fork_guards__/sidebarV2CardRows.test.ts

- id: sidebar-v2-error-tooltip
  intent: >
    The thread tooltip shows the session's actual last error, not a literal.
    Upstream's v0.0.30 tooltip restyle (dd5ea3248) flattened the line to the
    string "Error occurred", which removed the only place the sidebar
    surfaced what failed — diagnosing a dead session meant opening it, and
    this fork's users drive many agents at once from that sidebar. The
    message wraps rather than truncating: an error's tail (exit codes,
    paths) is routinely the useful half, and the tooltip is already the
    row's overflow surface. A sync that reintroduces the literal is a
    regression even though it renders fine.
  tier: 4
  files: []
  shadows: []
  watch:
    - apps/web/src/components/SidebarV2.tsx
  verify:
    - apps/web/src/__fork_guards__/sidebarV2ErrorTooltip.test.ts

- id: sidebar-v2-dev-server-pulse
  intent: >
    The thread card's branch/worktree mark pulses working-green to foreground
    while the port scanner attributes a listening server to that thread, so
    the row whose checkout the running server is actually serving can be
    picked out of the sidebar at a glance. The row's tooltip names what the
    mark can only signal — `localhost:<port>` for local threads, `port <n>`
    for remote ones, plus a `(+n)` overflow — so the pulse is never the only
    way to learn the port. The host split is load-bearing: a remote thread's
    listener is on the remote host, and unlike v1's Globe (a button routed
    through openDiscoveredPort to the right environment, where "localhost" is
    loose phrasing around a correct action) this label is inert text, so it
    must not name a machine the port is not on.

    Attribution is the port scanner's existing terminal→thread mapping and
    nothing more: a listener counts for a row only when the scanner's
    subprocess inspection traced it to one of the thread's own T3 terminals
    (`useThreadDiscoveredPorts`, `port.terminal.threadId`). A server started in
    an external shell arrives with `terminal: null` — the scanner knows its pid
    but not its cwd — and must light up nothing rather than a guessed row. The
    fuller feature (resolving the pid's cwd server-side and matching it against
    thread.worktreePath) is deliberately out of scope: it needs an apps/server
    + contracts change, recorded here so a future pass knows the seam.

    Second known limitation, broader than the first: when the scanner's
    process probe fails (`lsof` absent, its 5s timeout blown, any
    ProcessRunError), PortScanner falls back to probing COMMON_DEV_PORTS and
    every entry it yields carries `pid: null, terminal: null` — attribution is
    impossible in that mode, so no row can ever pulse, and nothing surfaces
    the degradation; it is indistinguishable from "no servers running".
    Relatedly, the lsof output is truncated at 1MiB, so on a host with very
    many listeners a port can drop out of one snapshot and return the next,
    which this mark would render as a flicker. Both are scanner behaviours,
    not introduced here — recorded because this is the first UI that turns
    them into peripheral-vision motion.

    Naming is deliberately restrained for the same reason: the scanner keeps
    every listening TCP socket — no port range, no process-name filter, no
    HTTP probe — so a debugger port, an ssh tunnel, or a database all light
    the mark. The accessible text therefore says "Server listening on port N"
    (what is actually known), never "dev server running", matching upstream's
    own restraint ("Open localhost:5173").

    Cost: a card row subscribes to its thread's environment discovered-servers
    stream, which retains the server-side port scanner (3s lsof poll,
    reference-counted) while subscribed. Stated precisely, because v2 is an
    opt-in replacement for v1, not a neighbour: enabling v2 adds this standing
    cost outright for its users — a v2 session with the sidebar open runs the
    lsof poll for the whole session even if the preview pane is never opened,
    where before this change nothing retained the scanner. It is the same
    cost every v1 user already pays (Sidebar.tsx calls the identical hook per
    row, unconditionally), which is the precedent for accepting it — not
    evidence that nothing changed. Subscriptions key on thread.environmentId,
    so a sidebar listing threads across M environments holds M streams and
    every one of those hosts runs the 3s poll for the session — worth naming
    because it leaves the machine. Slim (settled/snoozed) rows never draw the
    card meta, so they pass null and skip the subscription entirely rather
    than retaining the scanner for rows that cannot pulse.

    Green is `--sidebar-v2-status-working` — one hue for "alive" across the
    card — and the far pole is `--foreground`, not literal white, so light
    mode pulses toward ink instead of vanishing. A full breath is 8s (4s
    alternate): ambient status, not an alert — notification-shaped motion in
    this app means "blocked on you", which a healthy dev server is the
    opposite of. Both marks are currentColor, so animating `color` on the svg
    is the entire mechanism; `color` does not composite, so each live row
    repaints its 12px glyph every frame — accepted deliberately, same as the
    pixel rain, with content-visibility sparing offscreen rows. The state also
    rides in `sr-only` text after the branch name (identity before transient
    state) because the motion is invisible to a screen reader, and
    `prefers-reduced-motion` drops the animation onto a static working-green
    mark rather than dropping the state.
