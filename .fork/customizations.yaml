- id: fork-sidebar-chrome
  intent: >
    The sidebar's collapse toggle lives inside the sidebar header, beside the
    macOS traffic lights, so it reads as belonging to the panel it collapses
    rather than as chrome floating over the workspace. It therefore leaves with
    the panel, so AppSidebarLayout's fixed SidebarControl still exists and still
    floats — but only while the sidebar is shut, which is exactly the case
    COLLAPSED_SIDEBAR_TITLEBAR_INSET_CLASS already reserves space for in every
    workspace header.

    The sidebar.toggle keybinding stays mounted unconditionally in
    AppSidebarLayout. Hanging it off the button would unmount it with the
    sidebar and leave a collapsed panel with no way back but the rail.

    Moving the chrome out took its imports with it, so SidebarV2.tsx's import
    header is deliberately shorter than upstream's: the ./ui/command, ./ui/kbd
    and ./ui/menu statements are gone entirely, along with EllipsisIcon, and
    upstream still imports and uses all of them. That header is the highest
    traffic conflict region in this file during a sync, and the divergence is
    intentional rather than a botched resolution — a sync must not restore
    those imports to make a conflict go away, because nothing in the fork's
    copy references them any more.

    The thread list pays for its own scroll gutter. scrollbar-gutter:stable
    reserves the scrollbar inside the list's padding box, so the symmetric px-2
    from Figma 113:3718 spends 8px of air on the left and 8 plus the scrollbar
    on the right. The list's end padding gives the gutter width back. The gutter
    itself stays: the scrollbar keeps its lane, the cards are 8px from both
    edges, and the compensation is meaningless without the gutter that causes
    it, so the two must move together.

    The width given back is measured, not assumed. --app-scrollbar-width is only
    true where ::-webkit-scrollbar applies: Firefox sets no scrollbar-width, so
    it reserves the native scrollbar (~15px) and a token-sized giveback
    under-corrects, while with macOS overlay scrollbars it reserves nothing at
    all and the giveback over-corrects. custom/useScrollGutterWidth publishes
    the browser's own answer (offsetWidth - clientWidth) as
    --sidebar-list-gutter, so the rule holds on every engine.

    One source for the 8px: both sides read --sidebar-list-pad. Spelled twice —
    once as a start padding and once as a base to subtract from — a retune of
    one leaves the other subtracting from a stale number, and the cards drift
    off the chrome icons' axis with nothing failing.

    Chrome rows use ps-2 pe-3 with an inner px-1 control so their leading icon
    also sits at 12px — matching card status and the group folder glyph. Search
    and All projects controls are 28px tall (h-7), not Figma's 24.

    These rows' own trailing inset is then 4px, and that 4px belongs to
    sidebar-v2-row-action-hit-area, which owns the trailing glyph column's
    single axis. It is not a scrollbar term and must not become one again.

    The brand moves to the header's trailing edge, where it stops competing
    with the toggle for the corner the eye starts at. The search and project
    rows are 36px and 12px rather than 32px and 14px so they read as chrome
    rather than as two more list items; the project row takes a leading
    caret-up-down with no trailing chevron and no favicon, and its trailing
    action is folder-open.

    The Dev channel's header art is the designer's own dither PNG instead of
    upstream's blue blueprint, painted as a covering background rather than a
    repeating tile (the diagonal ramp cannot survive tiling without drawing a
    seam). Unlike upstream's art the band does not dissolve: it is a solid slab
    the height of the topbar with a hard bottom edge, so the mask and gradient
    ::after that upstream uses to fade its own art are switched off for this
    variant alone, keyed on :has().

    Upstream treats header art as a channel indicator — Dev and Nightly only,
    nothing on a release build. The fork splits that in two. The sidebar header
    always carries artwork, because here it is brand chrome rather than a build
    cue: a release build gets the green dither where upstream gave it nothing,
    and a dev build gets the orange variant of the same family — hue is what
    replaces the channel cue the sidebar gave up by always carrying art. The
    two other surfaces upstream paints with the same art, the composer send
    button and the standalone auth screen, keep upstream's behaviour untouched
    and still light up on Dev alone. Those two need no fork code: they already
    gate on resolveSidebarStageBackdropVariant, which is null on a release
    build. Nightly stays on upstream's night sky.

    The raster-vs-SVG history and the reason Nightly is unreachable in practice
    are in .fork/notes/FORK-CUSTOMIZATION-DECISIONS.md.

    Upstream v0.0.30 layered an environmentIdentificationMode setting
    (artwork / pill / none) over the same surfaces. The fork's header art
    ignores it — brand chrome is not identification and must not gate on a
    setting whose off states would strip the packaged app's header — but the
    pill half is honored: "Version pill" renders upstream's badge in this
    header, white-on-art rather than secondary-on-plain, because upstream only
    ever drew the pill here and dropping it would make that option do nothing
    anywhere. artwork/none keep governing the composer send button exactly as
    upstream wrote it; the standalone auth screen never read the mode —
    upstream gates that art on the build channel alone — so the setting's
    only fork-visible effects are the composer button and this pill. The
    same release also moved
    upstream's search/scope controls into SidebarContent's fixedHeader slot;
    the fork declines that mechanism — its own rows sit as siblings above the
    self-scrolling list group, which pins them identically — and a sync must
    not re-adopt fixedHeader here just to shrink a conflict. The header's
    stage label now comes from upstream's useEnvironmentStageLabel, which
    replaced the fork's local hook when upstream's became an exact equivalent
    (both delegate to resolveServerBackedAppStageLabel with the fork's
    APP_STAGE_LABEL fallback).
