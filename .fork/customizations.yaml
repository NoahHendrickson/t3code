    theme.custom.palettes.css. Only --fork-design-canvas stays opaque there: it
    is pinned to the guest's CANVAS_BG and the seam shows if it moves. The panel
    surface must stay driven by --fork-design-surface for that to reach it — a
    fill hardcoded onto the container sails past the glass block entirely, which
    is exactly how the panel read as a slab while the rail beside it went glassy.
