- id: fork-sidebar-chrome
  intent: >
    The sidebar's collapse toggle lives inside the sidebar header, beside the
    macOS traffic lights, so it reads as belonging to the panel it collapses
    rather than as chrome floating over the workspace. It therefore leaves with
    the panel, so AppSidebarLayout's fixed SidebarControl still exists and still
    floats — but only while the sidebar is shut, which is exactly the case
    COLLAPSED_SIDEBAR_TITLEBAR_INSET_CLASS already reserves space for in every
    workspace header.

    The sidebar.toggle keybinding stays mounted unconditionally in
    AppSidebarLayout. Hanging it off the button would unmount it with the
    sidebar and leave a collapsed panel with no way back but the rail.

    Moving the chrome out took its imports with it, so SidebarV2.tsx's import
    header is deliberately shorter than upstream's: the ./ui/command, ./ui/kbd
    and ./ui/menu statements are gone entirely, along with EllipsisIcon, and
    upstream still imports and uses all of them. That header is the highest
    traffic conflict region in this file during a sync, and the divergence is
    intentional rather than a botched resolution — a sync must not restore
    those imports to make a conflict go away, because nothing in the fork's
    copy references them any more.

    Same spirit, opposite direction: Sidebar.logic.ts keeps upstream's
    searchSidebarThreadsByTitle (and its tests) even though nothing in the
    fork's copy of SidebarV2 renders it. Upstream's inline sidebar thread
    search (#4769) lives in the chrome this customization replaced, so the
    2026-08-02 sync deliberately did not adopt its UI; the pure helper stays
    so a future port into SidebarV2ChromeRows is a design decision, not an
    archaeology dig. It is an orphan on purpose — do not "clean it up", and
    do not count its tests as coverage of a rendered path.

    The thread list pays for its own scroll gutter. scrollbar-gutter:stable
    reserves the scrollbar inside the list's padding box, so the symmetric px-2
    from Figma 113:3718 spends 8px of air on the left and 8 plus the scrollbar
    on the right. The list's end padding gives the gutter width back. The gutter
    itself stays: the scrollbar keeps its lane, the cards are 8px from both
    edges, and the compensation is meaningless without the gutter that causes
    it, so the two must move together.

    The width given back is measured, not assumed. --app-scrollbar-width is only
    true where ::-webkit-scrollbar applies: Firefox sets no scrollbar-width, so
    it reserves the native scrollbar (~15px) and a token-sized giveback
    under-corrects, while with macOS overlay scrollbars it reserves nothing at
    all and the giveback over-corrects. custom/useScrollGutterWidth publishes
