# Register of every intentional deviation from upstream — see .fork/README.md §4a.
#
# This file is read by two consumers:
#   - .fork/detect-drift.mjs (Layer 1 CI) — flags upstream commits touching
#     watched files
#   - the daily sync routine — reads `intent` before resolving any conflict,
#     so it preserves the intent rather than the literal old lines
#
# Format constraints (the parser is dependency-free and line-based — keep it
# simple):
#   - each entry starts with `- id: <slug>` at column 0
#   - list keys (files/shadows/watch/verify) are two-space indented, one
#     `- <path>` per line beneath them; use `[]` for an empty list
#   - `intent:` is `>`-folded free text; don't start intent lines with `-`
#
# Keys:
#   files:   fork-owned files implementing the customization (Tier 1/2 paths;
#            upstream never touches these)
#   shadows: upstream modules replaced via src/overrides/ — drift-watched
#   watch:   upstream files carrying Tier-4 inline edits — drift-watched
#   verify:  guard tests that fail if the customization is silently lost

- id: ci-on-custom
  intent: >
    Direct pushes to the custom branch run the full CI suite. Upstream's CI
    triggers on pull_request and pushes to main only; custom is this fork's
    working branch, so a push to it (like a merged sync) must be validated
    the same way main is upstream.
  tier: 4
  files: []
  shadows: []
  watch:
    - .github/workflows/ci.yml
  verify:
    - apps/web/src/__fork_guards__/ciOnCustom.test.ts

- id: ci-runners
  intent: >
    CI jobs run on GitHub-hosted runners (ubuntu-latest / macos-latest) with
    30-minute timeouts. Upstream targets Blacksmith runners, whose GitHub app
    is installed on pingdotgg but not on this fork, so upstream's labels queue
    forever here. If Blacksmith is ever installed on the fork, this
    customization can be retired wholesale.
  tier: 4
  files: []
  shadows: []
  watch:
    - .github/workflows/ci.yml
  verify:
    - apps/web/src/__fork_guards__/ciRunners.test.ts

- id: fork-workflow-docs
  intent: >
    Every coding agent that opens this repo learns the fork rules before
    changing anything: AGENTS.md (and its CLAUDE.md symlink) carries a fenced
    Fork Workflow section pointing to .fork/AGENTS.md, which defines the
    branch model (work from custom, never touch main) and the placement
    ladder for fork changes.
    CLAUDE.md is a Tier-4 inline edit the fork owns outright, and it
    deliberately diverges from the blob upstream ships. Upstream's committed
    symlink target carries a trailing newline, so it names a file that cannot
    exist and CLAUDE.md resolves to nothing — upstream fixed that in 5e13f5357
    and reintroduced it in 6891c77d3, so it recurs. The fork's blob is the
    9-byte target with no newline. Resolve any sync conflict on CLAUDE.md by
    keeping the fork's side; taking upstream's restores the bug and silently
    strips the rules from every Claude agent. It is the one Tier-4 edit that
    cannot carry the usual begin/end fence comments: a symlink's blob is its
    target verbatim, so a comment marker inside it would break the very link
    the marker exists to describe. The watch entry is the whole fence.
  tier: 4
  files:
    - .fork/AGENTS.md
  shadows: []
  watch:
    - AGENTS.md
    - CLAUDE.md
  verify:
    - apps/web/src/__fork_guards__/forkWorkflowDocs.test.ts

- id: release-upstream-only
  intent: >
    The Release workflow never runs on this fork. Upstream releases on a
    3-hourly cron and on version tags, publishing the CLI to npm and cutting
    GitHub Releases; neither is this fork's job, and the fork has no npm or
    release credentials. Both entry-point jobs (check_changes, preflight) are
    gated on the repository being upstream, and every downstream job already
    requires preflight to have succeeded, so the gate cascades to the whole
    workflow. Until this gate existed the runs did not publish only because
    they hung forever on Blacksmith runners the fork cannot schedule (see
    ci-runners) — an accident, not a safeguard. Keep the gate independent of
    the runner labels so retiring ci-runners can never start publishing from
    the fork.
  tier: 4
  files: []
  shadows: []
  watch:
    - .github/workflows/release.yml
  verify:
    - apps/web/src/__fork_guards__/releaseUpstreamOnly.test.ts

- id: fork-desktop-release
  intent: >
    The fork can cut its own downloadable desktop build without borrowing any
    part of upstream's release identity. Upstream's Release workflow deploys
    the production Cloudflare relay, publishes the CLI to npm, signs with
    upstream's Apple and Azure certificates and announces to upstream's
    Discord; release-upstream-only gates all of that off here, so the fork
    needs a path of its own. fork-release.yml builds macOS arm64 unsigned and
    publishes to this repository's Releases, using only the automatic
    GITHUB_TOKEN. Two properties matter more than the build itself: it runs on
    workflow_dispatch alone, so no sync, tag or cron can ever publish from the
    fork by surprise; and it must never grow a package-registry publish step,
    because the fork builds under upstream's package names. Signing is absent
    on purpose, not by oversight — the build script already degrades when the
    Apple secrets are missing, so adding them later is a change to one step.
  tier: 1
  files:
    - .github/workflows/fork-release.yml
    - .github/scripts/launch-isolation-check.sh
  shadows: []
  watch:
    # ci.yml carries a fenced fork hunk: release_smoke lints the isolation
    # gate script on every PR, so a defect there costs a check, not a build.
    - .github/workflows/ci.yml
  verify:
    - apps/web/src/__fork_guards__/forkDesktopRelease.test.ts

- id: fork-app-identity
  intent: >
    A packaged fork build is a different application from an installed
    upstream release, and the two never share state. Upstream's release and
    this fork's build are both non-development builds, so every identity
    upstream derives from "is this a dev build" collapses onto the same value
    for both: the same bundle id, the same "T3 Code (Alpha).app" path in
    /Applications, the same ~/.t3 state tree holding state.sqlite and secrets,
    and the same Electron user data directory. Installing a fork build
    therefore offered to replace the real app, and running one would have
    adopted its live database — including the legacy directory upstream
    migrates from, which is why legacyUserDataDirName is redirected too rather
    than left pointing at "T3 Code (Alpha)". The fork presents as "no3y Code":
    bundle id com.t3tools.t3code.fork (unchanged across renames — it is the
    stable identity macOS keys on), installs as "no3y Code.app", ships
    no3y-Code-* artifacts, packages placeholder "N" lettermark art from
    assets/fork on all three platforms, and keeps all filesystem state under
    the fork-owned base directory ~/.t3-fork (also stable across renames, so
    display renames never orphan state). The name was "N3 Code" until it was
    renamed wholesale; renaming display strings is safe by construction here,
    precisely because the bundle id and the base directory are both held stable
    across renames. The one consequence worth stating: an installed
    "N3 Code.app" is not replaced by a build that installs as "no3y Code.app",
    so an upgrader keeps both bundles until the old one is deleted by hand.
    Isolation is forked at the base directory, not the "userdata" leaf,
    because the packaged app is two processes: the desktop resolves its own
    state directory and hands only baseDir (as bootstrap t3Home) to the
    bundled server child, which independently derives its stateDir, caches/
    and worktrees/ from it. A desktop-side leaf rename shipped in v0.1.1 and
    left the server child writing the real ~/.t3/userdata — see
    .fork/notes/FORK-DATA-ISOLATION-HANDOFF.md. Moving the base keeps both halves on
    upstream's own leaf derivations and isolates all three shared directories
    at once, with no fork hunks in apps/server. Development paths carry no
    fork rename — `vp dev` in this repo is already the fork — but upstream
    a17cbc3b4 changed where they point, so the older claim that dev simply
    keeps ~/.t3/dev is no longer true inside a linked git worktree. There,
    dev state is the worktree's own gitignored .t3, and because dev-runner
    exports that as T3CODE_HOME the server reads the base dir as explicit and
    derives the userdata leaf rather than the dev leaf. What must stay true is
    that no fork surface resolves to upstream's live ~/.t3/userdata; the
    mechanics of migrating state left behind at ~/.t3/dev are operational and
    live in .fork/AGENTS.md, not here, since they go stale once everyone has
    moved. Because baseDir also carries caches/ and worktrees/, a worktree's
    session checkouts now land inside the repo tree, which is why .t3 is
    excluded from the test, fmt and lint discovery lists in vite.config.ts and
    from the four .repos exclusions in .vscode/settings.json, the way .repos
    already was. The URL
    scheme is also deliberately left shared — t3code:// is the app's own
    internal origin, not just a deep-link handler, so changing only the
    registration would be incoherent; two installed apps contend for the
    scheme, which is untidy but not destructive. The rendered app now carries
    the name too: the sidebar brand reads APP_BASE_NAME, and branding.ts's
    bridge-less fallback points at the fork's own constant instead of upstream's
    "T3 Code", which had left dev and hosted sessions branded as upstream while
    the packaged app was not — the exact ambiguity the rename exists to remove.
    The sidebar lockup drops the T3 wordmark rather than pairing a borrowed
    glyph with a different name. Splash, favicon and resolveDesktopWebAssetBrand
    still carry upstream's T3 art: those are images rather than strings, and
    replacing them is separate work. An
    explicit T3CODE_HOME still overrides the fork base on both halves, with
    one refused value: upstream's own ~/.t3, which a non-development build
    rejects at startup rather than opening the real app's database. Known
    carve-out: the WSL backend bootstrap deliberately omits t3Home, so
    WSL-side state is not isolated by this customization.
  tier: 4
  files:
    - apps/web/src/custom/forkBranding.ts
    - assets/fork/n3-macos-1024.png
    - assets/fork/n3-universal-1024.png
    - assets/fork/n3-windows.ico
  shadows: []
  watch:
    - apps/desktop/src/main.ts
    - apps/desktop/src/app/DesktopApp.ts
    - apps/desktop/src/app/DesktopAppIdentity.test.ts
    - apps/desktop/src/app/DesktopEnvironment.ts
    - apps/desktop/src/app/DesktopEnvironment.test.ts
    - apps/desktop/src/backend/DesktopBackendConfiguration.ts
    - apps/server/src/config.ts
    - apps/web/src/branding.ts
    - apps/web/src/branding.test.ts
    - apps/web/src/components/sidebar/SidebarChrome.tsx
    - packages/shared/src/devHome.ts
    - packages/shared/src/hostProcess.ts
    - scripts/build-desktop-artifact.ts
    - scripts/build-desktop-artifact.test.ts
    - scripts/dev-runner.ts
    - vite.config.ts
    - .vscode/settings.json
  verify:
    - apps/web/src/__fork_guards__/forkAppIdentity.test.ts

- id: fork-marker
  intent: >
    The running app is identifiable as this fork: the document root carries
    data-fork="noahhendrickson-t3code", and the fork-owned theme layer
    (theme.custom.css) loads after upstream's index.css so fork styling wins
    ties. Seed customization proving the Tier-1 + Tier-4 pattern end to end;
    all fork CSS must stay scoped under the marker attribute.
  tier: 1
  files:
    - apps/web/src/custom/forkMarker.ts
    - apps/web/src/theme.custom.css
  shadows: []
  watch:
    - apps/web/src/main.tsx
  verify:
    - apps/web/src/__fork_guards__/forkMarker.test.ts

- id: phosphor-duotone-icons
  intent: >
    The app's iconography is Phosphor at the duotone weight, not lucide.
    Rather than rewriting ~89 import sites across the hottest upstream files
    (ChatView, SidebarV2, ChatComposer), "lucide-react" is aliased to a
    fork-owned shim that re-exports Phosphor under lucide's export names. Call
    sites keep importing "lucide-react" verbatim, so upstream can add, move, or
    delete icon usage freely and this fork inherits it. Glyphs with no enclosed
    area (carets, checks, arrows, spinners) are pinned to the bold weight,
    since duotone is indistinguishable there and reads too light against
    lucide's 2px stroke. The shim also reproduces lucide's `lucide lucide-<name>`
    SVG classes, because upstream tests assert them to identify which icon
    rendered — honouring the contract keeps those tests passing unmodified
    instead of forcing Tier 4 edits into upstream test files.
  tier: 1
  files:
    - apps/web/src/custom/icons/lucide-phosphor.tsx
  shadows: []
  watch:
    - apps/web/vite.config.ts
    - apps/web/tsconfig.json
  verify:
    - apps/web/src/__fork_guards__/phosphorIcons.test.ts

- id: sidebar-v2-card-rows
  intent: >
    Sidebar V2 thread rows are three-line cards at 8px radius: a title line, a
    repo line (project plus branch), and a meta line whose two halves sit in
    fixed corners — PR number and diff counts on the left, model label and
    runtime glyph on the right. Splitting repo from meta is the point: the two
    things you compare across rows, what a thread is and how big it got, are
    then always at the same x.

    Surface encodes interaction and nothing else. A row is filled on hover and
    when selected or routed to; it is never filled because of its status. An
    earlier revision gave working rows a resting fill on the theory that a live
    agent should look alive, and with several threads running the panel became
    a field of lit rectangles in which the hover cue meant nothing. Working
    instead recedes: it is the one status whose title drops to muted, because a
    running agent is the row you can least act on.

    Status text labels ("Working", "Approval") are replaced by a single 16px
    mark in a fixed trailing slot, and the slot is never empty — idle draws a
    hollow ring rather than falling back to a relative-time string, which used
    to make the trailing column alternate between a mark and a variable-width
    label so nothing below it could align. The mark's form carries the state —
    falling pixels while the agent runs, a static dot once it stops, a clock
    for woke, a ring for idle — and the hue only reinforces it, which is the
    vocabulary the phanttom Ghostty sidebar uses. Working takes emerald from
    that design rather than the sky the mobile Live Activity still uses; the
    divergence is deliberate and mobile has not been migrated.

    Diff counts bind to --success-foreground / --destructive-foreground rather
    than emerald/red literals, so they hold up in light mode. They render only
    once latestTurnDiff() returns data: it is an upstream stub returning null
    today, and the slot is built to light up when the shell projection grows
    checkpoint summaries.

    The status palette and the rain keyframes live in the Tier 1 stylesheet;
    only the five --color-sidebar-v2-status-* utility registrations sit inline
    in index.css, because Tailwind reads utility names from the @theme block
    alone and will not see them anywhere else.
  tier: 4
  files:
    - apps/web/src/custom/SidebarV2StatusIndicator.tsx
    - apps/web/src/custom/SidebarV2ThreadCardMeta.tsx
    - apps/web/src/custom/sidebarV2RowPolicy.ts
    - apps/web/src/theme.custom.css
  shadows: []
  watch:
    - apps/web/src/components/SidebarV2.tsx
    - apps/web/src/index.css
  verify:
    - apps/web/src/__fork_guards__/sidebarV2Rain.test.ts
    - apps/web/src/__fork_guards__/sidebarV2CardRows.test.ts

- id: fork-surface-palette
  intent: >
    The dark shell is not black. The workspace stage is #212121 and the sidebar
    v2 panel is #1e1e1e, so the panel sits below the stage rather than lifting
    off it — the inverse of upstream's "surfaces lift from the base" model, and
    deliberate: the panel is chrome, the stage is the work. Borders are #2d2e2e,
    row hover #262626, row selected and route-active #2a2a2a.

    Every value is flat opaque sRGB, not an alpha over the panel. Alpha
    compounds — a fill inside a hovered row inside a selected row lands on a
    colour nobody specified — and these are only correct against #1e1e1e
    anyway, so freezing them is honest about that.

    Two blocks are required and the second is not redundant: upstream
    re-declares --background, --card, --border and the whole --sidebar-* family
    on the panel element itself, and a custom property set only at :root never
    reaches an element that declares its own.

    Light mode is untouched and keeps upstream's zinc hierarchy. Only the v2
    panel is repainted; v1 keeps upstream's black so the beta toggle stays a
    real A/B, which does mean a v1 sidebar sits against the new stage — the
    stage is global chrome and carries no sidebar-version attribute to key off.
  tier: 1
  files:
    - apps/web/src/theme.custom.css
  shadows: []
  watch:
    - apps/web/src/index.css
  verify:
    - apps/web/src/__fork_guards__/forkSurfacePalette.test.ts

- id: fork-sidebar-chrome
  intent: >
    The sidebar's collapse toggle lives inside the sidebar header, beside the
    macOS traffic lights, so it reads as belonging to the panel it collapses
    rather than as chrome floating over the workspace. It therefore leaves with
    the panel, so AppSidebarLayout's fixed SidebarControl still exists and still
    floats — but only while the sidebar is shut, which is exactly the case
    COLLAPSED_SIDEBAR_TITLEBAR_INSET_CLASS already reserves space for in every
    workspace header.

    The sidebar.toggle keybinding stays mounted unconditionally in
    AppSidebarLayout. Hanging it off the button would unmount it with the
    sidebar and leave a collapsed panel with no way back but the rail.

    Moving the chrome out took its imports with it, so SidebarV2.tsx's import
    header is deliberately shorter than upstream's: the ./ui/command, ./ui/kbd
    and ./ui/menu statements are gone entirely, along with EllipsisIcon, and
    upstream still imports and uses all of them. That header is the highest
    traffic conflict region in this file during a sync, and the divergence is
    intentional rather than a botched resolution — a sync must not restore
    those imports to make a conflict go away, because nothing in the fork's
    copy references them any more.

    Both rows carry a trailing inset of --app-scrollbar-width. They sit in a
    container with the same 8px padding as the thread list below, so their
    content edges ought to agree — but the list is a scroll container and its
    scrollbar takes real layout width, leaving every card short by exactly that
    much and the trailing button overhanging them. The inset reads the token
    rather than restating 6px, so the alignment follows upstream if the
    scrollbar is ever retuned.

    The brand moves to the header's trailing edge, where it stops competing
    with the toggle for the corner the eye starts at. The search and project
    rows are 36px and 12px rather than 32px and 14px so they read as chrome
    rather than as two more list items; the project row takes a leading
    caret-up-down with no trailing chevron and no favicon, and its trailing
    action is folder-open.

    The Dev channel's header art is the designer's own green dither PNG instead
    of upstream's blue blueprint. Nightly keeps its night sky, so the two
    channels still read apart at a glance. It is painted as a covering
    background rather than a repeating tile: the artwork ramps diagonally from
    dark at the bottom-left to light at the top-right, so any repeat butts a
    light edge against a dark one and draws a seam. Covering crops the extremes
    of that ramp on a short band and keeps the gradient continuous instead.
    An earlier revision regenerated the pattern as an 8x8 Bayer dither in SVG,
    which scaled to any width and re-themed from two variables, but could only
    approximate the reference — a horizontal ramp cannot survive tiling, so the
    diagonal had to be flattened to a vertical one. The raster is the artwork as
    drawn; the tradeoff is that it cannot re-theme and is a screenshot-quality
    source (~30% of its pixels are the two flat greens, the rest resampling), so
    a higher-resolution export would be a straight swap of the file.
    Unlike upstream's art the band does not dissolve: it is a solid slab the
    height of the topbar with a hard bottom edge, so the mask and gradient
    ::after that upstream uses to fade its own art are switched off for this
    variant alone, keyed on :has().

    Upstream treats header art as a channel indicator — Dev and Nightly only,
    nothing on a release build. The fork splits that in two. The sidebar header
    always carries artwork, because here it is brand chrome rather than a build
    cue, and a release build gets the green dither where upstream gave it
    nothing. The two other surfaces upstream paints with the same art, the
    composer send button and the standalone auth screen, keep upstream's
    behaviour untouched and still light up on Dev alone — so the channel cue
    survives, just not in the sidebar. Those two need no fork code: they already
    gate on resolveSidebarStageBackdropVariant, which is null on a release
    build.

    There are two artworks, not one: green for a release build and orange for a
    dev build, sharing a ramp direction and cell rhythm so they read as one
    family with only the hue separating them. That is what replaces the channel
    cue the sidebar gave up by always carrying art.

    Nightly stays on upstream's night sky. The fork has never cut a Nightly
    build — that label needs a -nightly.YYYYMMDD.N version and the release
    workflow takes a hand-entered 0.1.2-shaped one — so the branch is
    unreachable in practice; leaving it costs nothing and stays correct if that
    changes or if upstream reworks that art.
  tier: 4
  files:
    - apps/web/src/custom/SidebarHeaderBackdrop.tsx
    - apps/web/src/custom/SidebarV2ChromeRows.tsx
    - apps/web/src/custom/SidebarStageDitherArt.tsx
    - apps/web/src/custom/assets/sidebar-stage-dither-dev.png
    - apps/web/src/custom/assets/sidebar-stage-dither.png
    - apps/web/src/theme.custom.css
  shadows: []
  watch:
    - apps/web/src/components/AppSidebarLayout.tsx
    - apps/web/src/components/SidebarStageBackdrop.tsx
    - apps/web/src/components/SidebarStageBackdrop.test.tsx
    - apps/web/src/components/SidebarV2.tsx
    - apps/web/src/components/sidebar/SidebarChrome.tsx
    # Defines --app-scrollbar-width, which the chrome rows' trailing inset reads
    # to stay flush with the thread cards. Retiring or renaming that token
    # silently un-aligns the two.
    - apps/web/src/index.css
  verify:
    - apps/web/src/__fork_guards__/forkSidebarChrome.test.ts

- id: fork-workspace-header
  intent: >
    The workspace topbar is 56px. One token drives both it and the sidebar
    header; the design draws them at 56 and 52, but they sit side by side
    across a 1px divider, so a 4px split would misalign the seam. Read as
    unintentional and kept equal. The .wco rule re-derives the token from
    env(titlebar-area-height), so on Windows with Controls Overlay the OS still
    dictates the height and only the fallback moves.

    Project and title swap weight: the project is the fixed, repeating half, so
    it takes semibold and becomes the landmark you navigate to, while the title
    is long unique prose that reads better at regular weight than as a second
    bold run competing with it. The project favicon is gone — it sat left of a
    name that already said the same thing, in a header whose left half is
    fighting three action pills for width.

    Those three controls (Add action / Open / PR) become fully-rounded split
    pills. They were already built from the right primitives — a Group wrapping
    an outline Button size="xs", a separator, and a caret Button size="icon-xs",
    where Group flattens the inner corners and size="xs" is already 24px and
    12px at >=sm — so nothing structural changes. The only edit in those three
    files is a data-fork-pill attribute; the styling is all in the Tier 1
    stylesheet, which rounds the outer corners, drops the raised treatment that
    reads as a button floating above a page, and opens padding to 10px/7px.

    The two panel toggles render at 16px, and their glyphs become SquareHalf and
    SquareHalfBottom via the Phosphor shim rather than at the call site — see
    phosphor-duotone-icons. Upstream's framed-panel glyphs were hard to tell
    apart from the sidebar toggle three controls to the left; a filled half
    reads as "this edge" at a glance.
  tier: 4
  files:
    - apps/web/src/theme.custom.css
  shadows: []
  watch:
    - apps/web/src/components/GitActionsControl.tsx
    - apps/web/src/components/ProjectScriptsControl.tsx
    - apps/web/src/components/chat/ChatHeader.tsx
    - apps/web/src/components/chat/OpenInPicker.tsx
    - apps/web/src/components/chat/PanelLayoutControls.tsx
    - apps/web/src/index.css
  verify:
    - apps/web/src/__fork_guards__/forkWorkspaceHeader.test.ts

- id: fork-clerk-launch-resilience
  intent: >
    A keyless fork build never races the Clerk bridge. Upstream registers the
    renderer's t3code:// scheme privileges inside @clerk/electron's
    createClerkBridge, called during Effect layer construction — which races
    Electron's "ready" event, because registerSchemesAsPrivileged throws once
    the app is ready. Fast machines win that race; CI runners lose it
    deterministically, and a cold local boot is the same dice roll (the
    v0.1.2 launch isolation gate caught it: the app exited before its server
    ever started). Fork builds bake no Clerk publishable key, so the bridge
    is guaranteed dead weight — DesktopClerk skips it outright when
    desktopClerkFrontendApiHostname is undefined, logging a warning, and
    main.ts registers both schemes' privileges synchronously at module load
    (guaranteed to precede "ready"; the sole registrar on the skip path;
    observed against the bundled Electron 41 that pre-ready re-registration
    by a keyed build's bridge replaces the list harmlessly). Keyed builds
    keep upstream's behavior exactly: bridge created, initialization and
    cleanup failures both loud — the cleanup path's Effect.orDie is
    deliberately untouched, because a real Clerk defect in a keyed build
    must not hide behind a warning. The singleton-lock behavior in
    DesktopClerk.configure is bridge-independent and preserved on both
    paths.
  tier: 4
  files:
    - apps/desktop/src/app/DesktopClerkForkSkip.test.ts
  shadows: []
  watch:
    - apps/desktop/src/main.ts
    - apps/desktop/src/app/DesktopClerk.ts
    - apps/desktop/src/app/DesktopClerk.test.ts
  verify:
    - apps/web/src/__fork_guards__/forkClerkLaunchResilience.test.ts

- id: geist-typography
  intent: >
    The app's typefaces are Geist (UI) and Geist Mono (code), bundled as
    Fontsource variable faces and imported from the fork's own theme layer —
    web and Electron renderer only; mobile and marketing still ship DM Sans.
    The stacks live in theme.custom.css as --fork-font-sans / --fork-font-mono
    and index.css's @theme block reads them through
    var(--fork-font-sans, <upstream stack>); that indirection is load-bearing,
    not ceremony. The block is @theme inline, so Tailwind bakes font values
    literally into .font-sans / .font-mono and their variants, and a compiled
    utility cannot see a variable overridden in a later stylesheet — the same
    constraint that forces the sidebar-v2 palette registrations to live in
    index.css. Routing through --fork-font-* keeps the values scoped under the
    fork marker while the fallbacks leave an unmarked build on DM Sans.
    The terminal's font logic lives in custom/terminalFont.ts rather than in
    the drawer: xterm takes its font from a constructor option instead of the
    cascade, so --font-mono has to be resolved by hand and the cell grid
    re-measured once the webfont lands — xterm sizes columns at open(), and
    unlike the always-resident SF Mono a webfont can land after that, leaving
    the grid measured against the fallback. That is fork feature logic with no
    business in a 1.5k-line upstream mount effect. The drawer keeps two
    one-line call sites, and the font-load probe is derived from the resolved
    stack rather than hardcoded, so it cannot go stale on a face swap and an
    unmarked build names a local system face and fetches nothing. The re-fit
    also propagates to the PTY, because nothing in the drawer subscribes to
    onResize — every upstream fit site calls resizeTerminal by hand, and a
    re-fit that corrects only xterm's local grid leaves the PTY wrapping to the
    stale, fallback-measured width.
    Two further decisions are non-obvious. Geist Mono is listed AHEAD of SF Mono:
    upstream puts SF Mono first, which means on macOS its bundled mono webfont
    never renders at all, so preserving upstream's order would make shipping
    Geist Mono pointless. And body / pre, code are re-declared under the fork
    marker because upstream hardcodes the literal stacks on those selectors
    (index.css:964, index.css:1022) instead of reading its own @theme tokens,
    so overriding --font-sans / --font-mono alone does not reach them.
    DM Sans / JetBrains Mono deps and their main.tsx imports are deliberately
    left in place, but not because removing them would gain nothing, and the
    two are not the same case. Nothing references DM Sans in a marked build, so
    it costs nothing on the wire — but main.tsx still imports its Fontsource
    CSS, so Vite emits the woff2 files into dist and into the Electron package
    (roughly 60KB DM Sans, 96KB JetBrains Mono). For DM Sans the tradeoff is
    therefore installer size, not request count, and it is the one worth
    revisiting if package size matters; it is left as-is only to keep main.tsx
    conflict-free. JetBrains Mono is NOT a size question: the fork's own mono
    stack still names it, deliberately, as upstream's only bundled mono face —
    the fallback for a Linux user with no SF Mono and no Consolas when the
    Geist Mono fetch fails, which is exactly when it gets fetched. Dropping
    that dependency on size grounds would silently strip the face out from
    under a stack that still names it, and no guard would catch it: the guards
    assert the family is listed, not that a bundled face backs it.
  tier: 4
  files:
    - apps/web/src/theme.custom.css
    - apps/web/src/custom/terminalFont.ts
  shadows: []
