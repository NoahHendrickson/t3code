- id: fork-chat-file-drop
  intent: >
    A file drop that nothing claimed cannot navigate the app away to the
    dropped file. Upstream's v0.0.33 chat column
    (data-chat-workspace-drop-target + makeWorkspaceFileDropHandlers) now
    owns attaching drops over the whole column — which was this
    customization's original job, so the fork's parallel drop system was
    retired at that sync. What survives is the piece upstream still lacks: a
    window-level guard, mounted from ChatView, that preventDefaults file
    drags on dragover and drop when no nested target claimed them
    (defaultPrevented), with dropEffect "none" so the cursor does not promise
    an attachment. A missed drop over the sidebar, header, or right panel is
    discarded instead of replacing the session with the file.

    The guard listens in the bubble phase and stays purely additive: every
    real target — upstream's column, the file tree's mention-drag channel,
    any future surface — sees the event first, and only drags carrying files
    are touched. It holds no drag state and paints nothing; highlighting
    belongs to upstream's own column overlay and composer tint. Mounting from
    ChatView is the enablement gate: no chat column on screen, no guard, so
    drops elsewhere in the app keep their usual browser behaviour.
