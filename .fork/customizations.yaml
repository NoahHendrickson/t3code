- id: t3-connect-official-config
  intent: >
    Fork builds carry the same T3 Connect public configuration as official
    releases, so the cloud UI, the `t3 connect` CLI group, and the managed
    tunnel all work against upstream's hosted relay out of the box. Upstream
    injects four public values at release time from CI variables this fork
    does not have (release.yml's relay_public_config job); the fork instead
    tracks them in a repository-root .env, which scripts/lib/public-config.ts
    already reads for every dev run and build — with the right precedence
    built in, since process env and .env.local both outrank it, so a personal
    or self-hosted-relay override stays possible and stays gitignored. An
    override REPLACES a value; it cannot blank one — the loader resolves
    through firstNonEmpty, which treats empty as unset and falls through to
    the tracked file. Building with T3 Connect off means temporarily
    deleting the tracked .env in that checkout, never committing it. The
    file is force-added past .gitignore's .env* rule on purpose: tracked
    files are exempt from ignore rules, and upstream never ships a .env, so
    a sync can never conflict with it. The values are public identifiers,
    not secrets (docs/internals/t3-connect.md) — the same ones baked into
    every official artifact; they were read from the published npm CLI
    (t3@0.0.30). The .env must never grow server-side secrets or tokens; the
    guard pins its key set to exactly these four so secret creep fails CI.
    Two neighbouring customizations make keyed fork builds safe rather than
    accidental: fork-clerk-launch-resilience's keyless skip only engages
    when no publishable key is baked and keyed builds keep upstream's Clerk
    bridge behavior exactly, and fork-app-identity deliberately keeps the
    shared t3code:// scheme, which is the desktop OAuth callback Clerk's
    redirect allowlist expects. Relay access itself remains gated by the
    user's own Clerk account, which is what authorizes use of the hosted
    service.
  tier: 1
  files:
    - .env
  shadows: []
  watch:
    # Upstream's loader: the one place the repo-root .env is read and
    # projected into VITE_*/EXPO_PUBLIC_* aliases. If upstream renames the
    # canonical variables or stops reading .env, this customization dies
    # silently — the guard exercises the loader against the real repo root
    # so that failure turns CI red instead.
    - scripts/lib/public-config.ts
    # Carries a fenced note telling developers NOT to `cp .env.example .env`
    # in this fork — that documented upstream onboarding move would clobber
    # the tracked file. An upstream rewrite of the example must re-seat it.
    - .env.example
    # Two fenced stubs blank the baked CLI OAuth client id: upstream models
    # "unconfigured clone" by not stubbing the variable, which stopped being
    # the ambient default once the tracked .env keyed every build.
    - apps/web/src/cloud/connectCliAuth.test.ts
    # reconcileRootEnv writes relay public config — OTLP tracing tokens
    # included — into the repo-root .env, which this customization made
    # committable. Unfenced (the fork never runs relay deploys), but any
    # upstream rework of where that write lands must be re-checked against
    # the tracked file. See the decisions note.
    - infra/relay/scripts/deploy.ts
  verify:
    - apps/web/src/__fork_guards__/t3ConnectOfficialConfig.test.ts

- id: fork-design-mode
  intent: >
    The in-app preview browser carries a Figma-style design mode, ported from
    NoahHendrickson/the-forge, with a NATIVE properties panel. A Design
    toggle in the preview chrome row (desktop only, next to the three-dot
    menu) injects a self-contained HEADLESS engine bundle into the previewed
    page via webview.executeJavaScript — the guest keeps only what must touch
    the page (selection outlines, hover, inline-style drafts, structural
    verbs: inline text edit, drag-to-reorder, 8-point resize, delete/nudge,
    layout ripple, sessionStorage persistence) and pushes selection snapshots
    (computed styles per protocol.ts DESIGN_MODE_STYLE_KEYS) up over
    console-message lines prefixed __t3-design-mode__:. The panel is T3
    React (panel/ForkDesignPanel.tsx), docked as a column beside the browser
    surface by the PreviewPanel override: size, padding, margin, radius, typography,
    fill and opacity controls with scrub-to-edit fields, driving the guest
    through the window.__T3_DESIGN_MODE__ command handle
    (designModeBridge.ts, fire-and-forget except buildSend; the scrub-driven
    writes applyDraft and setInset coalesce host-side to one IPC crossing per
    animation frame, every other command flushes them first so order holds, and
    hoverElement dedupes against the last id sent — mouseover bubbles, so the
    layers rail fires it several times per row crossed and hover carries no new
    information on a repeat).
    Panel section order and field chrome follow the fork's own Figma spec (file
    fZRyRTZJtLKwuq8rj2SLg4, page V2, node 193:9686): a Position section (the six
    align verbs over an X/Y pair, absolute-position toggle in the header), a
    unified Layout section (W/H with per-axis Fixed/Hug/Fill menus and an
    aspect-ratio lock, direction, gap, the 3x3 align matrix, padding pairs) and
    Appearance (opacity, radius, per-corner grid) — with icon field prefixes
    (panel/PanelIcons.tsx, Phosphor at `regular`, NOT through the lucide duotone
    shim). Controls the spec does not draw are kept rather than dropped: margins,
    per-side padding/stroke, min/max sizing, the raw display select and the
    flex-child controls live behind in-section disclosures. Align is a set of
    VERBS with no read-back state; engine/align.ts maps each to the one honest
    CSS answer for that parent context (insets out of flow, align-self on an
    auto-layout child's CROSS axis only — Figma disables the main axis too —
    justify-self/align-self in grid, margin-auto for a block child with slack)
    and reports capabilities per axis in the snapshot so the panel disables what
    it cannot honor instead of writing something inert. Fields behave the way a
    designer expects: a multi-select shows Mixed rather than the first element's
    value (panel/selectionValues.ts) and any edit unifies it, numeric fields take
    arithmetic through a hand-rolled parser and never eval
    (panel/numericExpression.ts), sizing fields accept keywords (auto,
    fit-content, none) so the request ships intent instead of a measured px, and
    a property with a live draft carries a changed dot that reverts JUST that
    property (snapshot `drafted` + the revertDraft verb over the vendored
    DraftStore.discard, which is css-only so a structural draft survives).
    Scrub-shaped edits are undoable: one slider gesture, typed commit or nudge
    run is ONE Cmd+Z step (Cmd+Shift+Z redoes), bookkept host-side per tab in
    designUndoHistory.ts off the pre-gesture selection snapshots. The stack
    records only style drafts and X/Y insets; every other mutating verb clears
    it instead of letting Cmd+Z pop an older step past an action it cannot
    reverse, and navigation or engine teardown clears it because its entries
    name ids from the torn-down registry. Editable targets keep native text
    undo — the listener skips them.
    The layers rail is Figma's layers panel, not a static tree: it REVEALS the
    canvas selection (expanding ancestors and scrolling to the row), implements
    the ARIA tree contract for real (roving tabindex, arrows, expand/collapse,
    Home/End, Shift to extend), filters by label/tag with matches unfolded,
    shows a type glyph per row, and drags a row among its siblings. The whole
    rail collapses away (device-local localStorage flag, like the sidebar's own
    collapse prefs); since nothing of it is left to click, the control that
    reopens it lives in the preview chrome row's fenced leadingActions slot
    (ForkPreviewLayersToggle), and the flag, the availability predicate and the
    focus handoff are shared through layersCollapsed.ts so the two halves
    cannot disagree — each unmounts ITSELF on activation, so each hands focus
    to its counterpart rather than dropping it to <body>. Collapsing UNMOUNTS
    the rail rather than hiding it, so a hidden rail costs nothing while the
    guest re-emits layers; the accepted price is that the rail's view state
    (filter text, hand-folded rows, active row) starts over on reopen, with the
    reveal effect re-expanding the selection's ancestors. Reorder is
    sibling-relative over the wire (`reorderElement(id, beforeId)`) because the
    curated tree hoists tagged descendants through untagged wrappers — a row's
    position in the TREE is not its position in the DOM, so only the guest can
    turn "before this element" into an index; rows whose parent is not an
    auto-layout container report `reorderable: false` and refuse the drop,
    since the vendored move draft previews as inline `order`. Rows also carry a
    siblingGroup identifying their DOM parent, because tree siblings are not
    always DOM siblings and the drop gate must enforce the same rule the guest
    does. Rail rows serialize in visual order ONLY when the `order` in play is
    our own preview (read from inline style, never computed): an app that
    authors `order` keeps its rail in DOM order, because reorderById computes
    indices in DOM order and the two halves must agree. No hide/lock toggles:
    hiding an element in CSS-land IS "remove this element", which the delete
    draft already says honestly from the canvas. The guest handle carries
    DESIGN_MODE_PROTOCOL_VERSION and boot() rebuilds rather than reusing a
    handle stamped with a different one — a stale engine otherwise fails
    silently, its snapshots rejected wholesale by a stricter parser.
    Edits preview as inline styles and never touch source. Send delivers as a composer
    ATTACHMENT, never prompt text: the panel stores the built request in
    designChangeDraftStore, the composer renders it as an inline pill
    (element + compact delta, × to discard, tooltip shows the markdown),
    pending pills count toward sendability so a pill-only message sends,
    a Send REPLACES the pending pill for the same preview tab AND document
    rather than adding a second one (buildSend builds from all of a tab's
    live drafts, never from the selection, so a re-send built from the same
    draft set always supersedes the earlier pill — as a superset, or after a
    discard as the corrected set; both used to ride the same message as
    overlapping, sometimes contradictory asks). Both halves of that key are
    load-bearing: the TAB because two preview tabs hold independent draft
    sets, and the DOCUMENT because supersession is a per-document guarantee —
    drafts live exactly as long as their document, so the payload carries a
    per-engine-instance documentId (SPA route churn moves location.href but
    keeps the document, the engine, and the drafts) with pageUrl as the
    reload fallback (a reload mints a fresh documentId but restores the same
    page's drafts from sessionStorage). A Send after a real cross-page
    navigation misses both halves and appends — its drafts were re-located
    against the new document and dropped when they didn't resolve, so
    replacing would silently drop the previous page's pill: a duplicate ask
    is visible and recoverable, lost work is neither. Replacement reuses the previous entry's id and
    position so the chip updates in place instead of remounting and
    recoloring (the composer derives both its key and its fill from that id),
    and ChatView's fenced send path appends the full deterministic
    token-aware change-request markdown to the outgoing message inside
    <design_change_request> blocks — cleared only when the turn start
    succeeds, and then only the attachments that actually rode the message:
    the ids are captured before the start is awaited, so a Send made from
    the panel during that round trip is not dropped unsent (T3 threads ARE
    the delivery surface — the Forge's own chat
    feed, embedded sessions, MCP queue, watcher, verifier and every
    /__the-forge/* endpoint are deliberately not ported, and the engine
    must stay free of network calls). The host re-injects on dom-ready
    while the mode is on, so navigations and dev-server reloads keep the
    engine and its drafts — and it reconciles on every bridge attach too
    (probe the guest's protocol version, re-inject when it is absent or
    skewed, otherwise just re-activate), because this component unmounts
    whenever the right panel shows a terminal or a diff and a reload in
    that window would otherwise leave the mode "on" over a page with no
    engine, every command swallowed and Send answering "no changes" over
    intact drafts. A sent request leaves its drafts painted over whatever
    the agent then changed — inline styles win, so the page stops being
    evidence of anything until they come off — and the panel says so: once
    the turn that carried them ends, the footer measures instead of
    guessing: the guest's verifier (engine/verifySession.ts) suppresses
    every draft's inline declaration, reads what the current cascade
    produces, restores the exact painted values, and compares against the
    sent ledger — per property: landed / didn't land / changed differently
    / can't be checked, with missing elements and structural ops reported
    honestly as unmeasurable. Suppression is NOT the compare toggle
    (compare writes the recorded original back, which lies whenever the
    page authored its own inline style); the ledger is the Forge's own
    LifecycleSession + lifecycle-store sent slot, dormant here until this
    feature, registered at buildSend with the DraftStore's real keys and
    persisted so it survives the reload it exists to be checked after. The
    verdict re-measures after every mutation quiet-window while armed, so
    a late HMR corrects a wrong verdict rather than freezing it, and
    verification is gated on the same conditions rule the request records
    — a matching value verifies under any viewport (a pane resize cannot
    manufacture the asked-for value), while a DIFFERING value measured at
    another viewport reports can't-be-checked, never a false difference —
    and a property the send-time origin probe found page-authored inline is
    never judged at all: the draft and the page share one style slot there,
    so no suppression can read the page's own value without guessing.
    Element resolution is strict (exact source index or a unique css path,
    with the same persisted-selector fallback the drafts drain carries) —
    a deleted list row reports gone-from-the-page rather than measuring,
    and then committing against, a surviving sibling. The verification
    switch is symmetric and host-owned (setVerifying), armed by the footer
    while it offers and released by its cleanup — Keep, unmount, thread
    switch — with the intent persisted so the reload it waits for resumes
    it; the sent ledger and report are size-capped (the parser's own
    bounds, flagged truncated; the persisted projection yields before it
    could cost the drafts their sessionStorage). The ledger resolving
    guest-side (commit-all, discard) emits an explicit sent-resolved
    signal, never an empty display payload. Verdict wording has one home
    (VERIFY_VERDICT_LABELS) and stays at measurement strength: "landed"
    means the page renders the value — never that the agent's edit was
    good, which is the turn diff's question — and the same counts ride the
    transcript chip beside the agent's own reply (measurement answers "did
    it work", the reply answers "why not"; the chip never paraphrases it).
    Drop-landed commits via the DraftStore's targeted commit (the draft
    comes off without restoring the original — the code owns the value
    now), scoped to exactly the verified properties; Discard-all still
    names its full blast radius (every edit on the tab, including ones
    made after the send), because an unverified drop has no smaller honest
    unit: a hot reload re-mints element ids, so host-side sent identity
    alone is stale exactly when the prompt appears.
    What the block LEADS with, though, is not the report but an
    invitation to look at the page — a success-variant Alert whose one
    button is "View live changes" — and only a measured CONTRADICTION
    downgrades it to the verdict rows. That question is verify vocabulary,
    not presentation: isMeasuredContradiction lives in designSentPreviews
    beside verifySummaryLine and the label map, so the panel asks it
    rather than re-deciding it. Contradiction means unchanged or diverged
    — the page provably does not render what was asked. 'unverifiable' and
    'missing' deliberately do not qualify: both are absences of evidence
    rather than failures — an intent-shaped ask, a page-authored inline
    slot, an element a structural delete legitimately removed — and
    leading with them turned the overwhelmingly common good outcome into a
    warning about work that was fine, which is the opposite of this
    feature's job. Seeing the real page is also better evidence than any
    verdict line, which is why the default is an invitation rather than a
    claim; the green says "the turn is over, go look", never "your edit is
    correct", and the copy still asserts nothing the page did not produce.
    The block renders exactly one of three modes — contradiction, peek,
    invitation — and WAITING (no measurement yet) folds into the
    invitation rather than becoming a fourth: the invitation is already
    true before any reading arrives, and that choice is what makes the
    report path's summary non-null by construction rather than a nullable
    local with unreachable false arms.
    Looking is a PEEK, not a resolution: the button drives the panel's
    existing compare mode, which suppresses the drafts without destroying
    them, so an ask the agent missed can still be re-sent from the drafts
    the user already made. The selective drop stays reachable from the
    peek whenever the report counts anything landed, so a mixed result
    (applied beside unverifiable) never forces a choice between restoring
    every preview and discarding every edit on the tab. While the block
    offers, LEAVING compare is the answer to the question by whatever
    route it happens — the block's own Show previews, the footer's
    Before/After, or the mutation gate's leave-compare when the user
    starts editing again — so one effect owns that transition rather than
    each button, and the invitation can never reappear over a page already
    looked at. A late contradiction can swap the block from peek to report
    mid-look, so the report's keep-exit restores the page first: answering
    "keep previews" while they are still suppressed would leave the page
    contradicting the button just pressed. Compare has exactly ONE host
    writer, the panel's setComparing — the footer button, the mutation
    gate's leave-compare rule, Discard and the sent-preview block all
    route through it, so the guest, the host flag and the Before/After
    label cannot disagree about what the page is showing. The offer is gated on the thread's own projected turn, never
    on wall clock or observed status flips: the record carries the sent
    message's client-minted createdAt, adoption stamps the turn's
    requestedAt from that same time, and the prompt waits for a projected
    turn that covers the send AND satisfies isLatestTurnSettled — the app's
    shared "is the turn actually over", which stays false through the
    minutes-long adoption window where the session is null by design. So it
    can never invite dropping previews out from under a running or
    still-booting agent. It hides on its own while no drafts are left, but
    the record survives that state (an undo/redo peek is not an answer);
    only the footer's buttons, the panel's Discard, or tab teardown forget
    it. Restored drafts carry their ORIGINAL on the wire rather
    than re-deriving it: the toggle destroys the engine but leaves the
    previews painted, so the store's default prior oracle (the element's
    live inline style) would capture each draft's own value as the page's,
    making Discard restore the draft over itself and the send builder
    measure before === after. Closing a preview tab is the one moment the
    per-tab state (store entry, undo history, bridge hover memo) is dropped
    — a mere unmount must survive. Element→source mapping works WITHOUT any
    project setup: project-authored forge-mode JSX tags (data-dc-source)
    remain the most precise source and always win per element, but on
    untagged React pages the desktop preload's react-grab-backed resolver
    (a frozen __T3_DESIGN_SOURCE_RESOLVER_V1__ page global installed by
    src/preview/DesignSourceResolver.ts beside the element picker, reached
    through the fenced import in preview-pick-preload.ts) recovers
    file:line:col lazily — on hover dwell, selection, and send — and the
    engine synthesizes a canonical data-dc-source (marked
    data-t3-native-source so it is never mistaken for a project tag).
    A selection that is known-anonymous makes the panel read-only, with
    per-element state as the ONLY source of truth: snapshots carry a
    sourceState (resolved | pending | anonymous, protocol v5 — named apart
    from the pill's "unresolved sourceLabel" counter on purpose, the two have
    different inclusion rules) where `anonymous` means a native-source attempt
    SETTLED with no tag, no file, and no component name. No-resolver hosts
    settle elements as anonymous too (resolveAndTag's early exit records the
    settle), so there is no page-level sourceMode clause in the gate — the
    boot-time mode probe is a one-shot at dom-ready and must never pin a
    session-long lock. Mutating verbs write to ADDRESSABLE ids only, so a
    Shift-click mixed selection cannot fan drafts onto anonymous siblings, and
    the undo history records the same filtered set. The read-only rendering is
    a marker div ([data-fork-design-readonly]) whose theme.custom.css rules
    stop pointer events on inputs and non-disclosure buttons — NOT a disabled
    fieldset, which would also disable the Expando/section disclosures and
    make collapsed values unreadable; disclosures stay live via their
    aria-expanded. `pending` stays editable (no flicker), component/file-only
    context counts as resolved (PR #67's "Rendered by" line is real context),
    and promoteSourceResolution re-emits only on the pending→settled
    TRANSITION, coalesced per burst, so repeated failed retries and
    no-resolver fan-outs cost nothing. Inspection, selection and the layers
    rail stay live throughout; no install prompt, warning toast, or Forge
    handoff exists anymore. For elements that remain merely IMPRECISE rather
    than anonymous, the downgrade is VISIBLE instead of silent: the payload's
    per-element sourceLabel (null = unaddressed by send time) is counted
    host-side (protocol.ts countUnresolvedDesignElements) and surfaced on the
    composer pill and in the send toast, because buildSend's ~1.5s
    native-source grace means WHEN Send was clicked can change how precise
    the ask is.
    Holding Cmd hands the page back: while the modifier is down the guest
    stops intercepting, so the user can walk the app they are inspecting —
    follow a link, open a menu, fill a form — without leaving design mode or
    losing the selection. The gate is read off each event's metaKey rather
    than tracked from keydown, because the press that arms it routinely lands
    on T3's own chrome (the panel, the layers rail) while the click lands in
    the guest; that also means it cannot tell the two physical Cmd keys
    apart, and Meta-only makes this a macOS gesture. The click is REPLACED
    rather than released: Chromium reads Cmd+click on an anchor as "open in a
    new tab" and every router Link bails out of client-side navigation when
    metaKey is set, so the engine swallows the real event and re-dispatches a
    modifier-free copy at the same target — released as-is, the gesture meant
    to walk the app would open tabs instead of following links. Hover chrome,
    the source prefetch, click-to-select, double-click text edit, the
    keyboard verbs and the move drag all ask the same predicate; the
    selection's own resize handles stay live, being overlay chrome on an
    element the user already chose. The predicate, the click replacement and
    its re-entrancy guard live together in engine/browseHandoff.ts (the
    canvasSession/layersSession pattern), so the engine's handlers ask one
    boundary instead of each owning a copy of the policy. Canvas mode (the Forge's vendored
    CanvasMode, engine/vendor/canvas.ts) turns the page into a
    pannable/zoomable artboard — space-drag/middle-drag pan,
    cursor-anchored wheel and pinch zoom, the powers-of-2 ladder,
    zoom-to-fit/selection — toggled from a strip in the native panel over
    setCanvas/canvasCommand handle calls, with a change-gated canvas
    message carrying the settled zoom readout back; the gesture modules'
    scale() hooks read the live canvas scale so drags stay accurate while
    zoomed. "Cursor-anchored" is the fork's own zoomAnchor: a trackpad pinch
    reaches the guest as a synthesized ctrl+wheel whose coordinates do NOT
    carry the CSS scale the host renders the webview at once a screen size is
    picked, so anchoring on the zoom event walks the artboard toward the top
    left as you pinch in. Ordinary pointer events map correctly (hover and
    selection land where you click) and the cursor cannot move mid-pinch, so
    CanvasMode tracks the pointer and anchors on that, keeping the event's
    coordinates only as the before-any-pointer-move fallback.
    Entering canvas mode commits UPSTREAM's viewport back to fill so
    the webview owns the whole preview pane and the canvas with it (a stale
    device viewport would letterbox the canvas inside itself);
    theme.custom.css continues the same canvas gray across any letterbox that
    does appear — repainting the webview WRAPPER, whose own translucent
    bg-muted/35 is what draws that letterbox, and pinned to the guest's
    CANVAS_BG by a guard. The strip carries
    a screen-size picker (MacBook 14"/16", 24"/27" displays,
    panel/canvasResolutions.ts) so a designer names a size instead of dragging
    the viewport rails to it. It commits upstream's preview viewport with the
    screen's WIDTH verbatim — that width becomes the guest's real CSS
    viewport, so media queries, vw and breakpoints answer to the screen being
    previewed rather than to however wide the pane happens to be, which is the
    whole point (a page that hides content below a breakpoint must see the
    screen). The HEIGHT is derived from the measured pane so the frame's
    aspect ratio matches it and upstream's fit lands 1:1 on both axes with no
    letterbox; the cost is that the frame is not the screen's real height, so
    "above the fold" is not meaningful. A "True height" switch at the foot of
    the picker (device-local, OFF by default) opts into the screen's own
    height instead — a real 1512x982 browser, honest fold, letterboxed into
    canvas gray — and re-commits the applied screen immediately rather than
    waiting for the next pick. Either way the widest screens in a tall pane
    letterbox once the contract's viewport area cap bites.
    Freeform settings rather than new contract preset ids: the shared catalog
    is upstream's and phone/tablet only. A reset-view canvas command follows
    each SIZE commit so the artboard lands on the freshly sized window instead
    of keeping the previous size's pan/zoom; entry deliberately skips it, since
    CanvasMode seeds its transform from the live scroll. The handover hangs off
    the canvas-on transition rather than the toggle's click, so it also holds
    when canvas resumes on its own, and exiting puts back the viewport that was
    there before (or clears a frame picked inside canvas, whose picker is about
    to disappear with it). engine/vendor/** contains only the Forge leaf
    modules reachable from the headless engine; they keep the Forge's own
    formatting (fmt-ignored at the root config, same treatment as qrcodegen.ts),
    carry t3-fork-marked local edits, and are excluded from the web TS project
    in favor of their own tsconfig island; the engine is bundled to an
    injectable IIFE string by the fork:design-mode-engine Vite plugin as
    virtual:fork-design-mode-engine.

    Two accuracy rules govern what a change request is allowed to assert, both
    added after a request cost more time than doing the edit by hand, and both
    since corrected for how the underlying APIs actually behave.

    First, a css bullet may only say "change `px-2.5` -> `px-1`" once
    cssOrigin.ts has PROVED that class is the lever, by removing it and
    re-measuring while the element shows its original cascade. Removal alone
    cannot decide a TIE — if something else declares the same value, removing
    the class moves nothing — so a tie gets a second probe: the utility's own
    declared value is applied inline and re-measured, which resolves
    `calc(var(--spacing) * N)` in the element's context. A declared value that
    computes to something OTHER than the measured one means the utility
    provably lost (the motivating `px-2.5`-is-10px-but-measured-8px case is
    decided, not hedged); only a genuine same-value tie is reported as
    ambiguous and names BOTH. Culprit naming excludes exactly ONE selector —
    the probed utility's own single-class rule, a tautology — and nothing
    broader: a plain-CSS project's `.composer-chip` is the likeliest culprit
    there even though the element carries the class, and a competing utility on
    the element is a finding. When the class provably is not the lever the
    bullet names the winning rule and its file (Vite's data-vite-dev-id is what
    still carries the authored filename). Ranking is layer-aware: unlayered
    beats layered above
    specificity, because Tailwind v4 utilities are in `@layer utilities` and an
    unlayered fork rule of trivial specificity beats them. Two CSSOM traps are
    load-bearing here: since CSS Nesting a CSSStyleRule HAS a (truthy, empty)
    `cssRules`, so style rules must be handled before any grouping check or
    every declaration is skipped; and `matchMedia` never throws, so only
    CSSMediaRule may be condition-gated — `@supports`/`@container` must be
    descended into unconditionally.

    Second, a source location is only forwarded when react-grab reports the
    reporting frame as `isSymbolicated === true`. Not `!== false`: react-grab
    0.1.44 / bippy 0.5.41 return a frame UNTOUCHED when symbolication fails, so
    there is no `false` to test for and `!== false` passed every failure. The
    frame is paired by position first, since the context's filePath is
    normalized while the frame's fileName is a raw served URL. Rejection costs
    the LINE, not the file: `data-t3-source-file` keeps the authored path and
    `data-t3-component` the fiber's component name, rendered as "Rendered by
    `<X>` in path (line not resolvable)" and only when no location resolved.
    Hint results are TTL-evicted from the preload cache like nulls — they are
    not successes, and caching them would pin a transient failure for the
    element's lifetime.

    Third, the resolver snapshots the rendering component's primitive props
    (strings/numbers/booleans, `children` excluded, capped at 12 entries and
    64 chars per string) off the composite fiber whose displayName matches
    the reported component name — no match, no props, so the request never
    labels props with a component they do not belong to. The snapshot crosses
    the bridge only beside a component name, is re-validated on the guest
    side, rides the element as `data-t3-props`, is
    re-validated AGAIN when the request builder reads that page-controlled
    attribute back, and renders as "Rendered by `<Button>` — props:
    `variant="ghost" size="sm"`". It exists to ground the SCOPE guardrail's
    component-vs-one-off judgment in the design system's own vocabulary.
    The props POLICY (caps, JSX-shaped name pattern, `children` exclusion,
    control-character rejection) has ONE implementation —
    `normalizeForkDesignProps` in packages/shared/src/forkDesignProps.ts,
    the only module graph both the desktop preload and the web engine island
    can reach. What stays duplicated is the CALL at each trust boundary, not
    the rules; the five-line predicate twins beside it
    (normalizeFilePath/readSourceFile, normalizeComponentName/
    readComponentName) stay copied, because a copy is cheaper than a
    dependency at that size and twenty lines of policy is not.
    bippy is imported by its root export on purpose (the mangled-name d.ts of
    bippy/core cannot be imported by name; the root's hook-install side
    effect is guarded double work beside react-grab's bundled copy).

    Relatedly, the NO_PREVIEW guardrail must not promise upstream's automatic
    verification while this fork has not vendored client/verifier.ts; a guard
    test pins that wording. The SCOPE guardrail likewise diverges from
    upstream: instead of call-site-only scoping that skips shared-component
    edits, the agent judges component-wide vs one-off intent from the
    request's component/source context (selecting a Button and nudging its
    padding usually means the Button, not one instance), prefers project
    tokens over hard-coded values, and states which scope it chose. The same
    guard test pins that wording too.

