- id: fork-clerk-launch-resilience
  intent: >
    A keyless fork build never races the Clerk bridge. Upstream registers the
    renderer's t3code:// scheme privileges inside @clerk/electron's
    createClerkBridge, called during Effect layer construction — which races
    Electron's "ready" event, because registerSchemesAsPrivileged throws once
    the app is ready. Fast machines win that race; CI runners lose it
    deterministically, and a cold local boot is the same dice roll (the
    v0.1.2 launch isolation gate caught it: the app exited before its server
    ever started). A build with no baked Clerk publishable key has a bridge
    that is guaranteed dead weight — historically every fork build; since
    t3-connect-official-config, only a checkout without the tracked .env or
    one that blanks the key via .env.local. DesktopClerk skips it outright
    when desktopClerkFrontendApiHostname is undefined, logging a warning,
    and main.ts registers both schemes' privileges synchronously at module
    load (guaranteed to precede "ready") and is the sole registrar on every
    path: createDesktopClerkBridge no-ops the registrar for the duration of
    the createClerkBridge call and restores it after, because the bridge
    would re-register the identical privilege set and that call throws
    post-"ready". The suppression is load-bearing, not hygiene — packaged
    fork builds are keyed since t3-connect-official-config, and the v0.1.7
    dry run's launch isolation gate caught the keyed build losing the ready
    race and dying on the bridge's own registration (an earlier observation
    that pre-ready re-registration is harmless was true but answered the
    wrong case). Keyed builds otherwise keep upstream's behavior: bridge
    created, initialization and cleanup failures both loud — the cleanup
    path's Effect.orDie is deliberately untouched, because a real Clerk
    defect in a keyed build must not hide behind a warning. Keyed bridge
    behavior stays unit-covered by upstream's DesktopClerk.test.ts, whose
    fenced hunk bakes a key in before import; the registrar suppression by
    DesktopClerkForkRegistrarSuppression.test.ts; the keyless skip by
    DesktopClerkForkSkip.test.ts; and the packaged boot itself by
    fork-release.yml's launch isolation gate on every build, dry runs
    included. The singleton-lock behavior in DesktopClerk.configure is
    bridge-independent and preserved on both paths.
  tier: 4
  files:
    - apps/desktop/src/app/DesktopClerkForkSkip.test.ts
    - apps/desktop/src/app/DesktopClerkForkRegistrarSuppression.test.ts
  shadows: []
  watch:
    - apps/desktop/src/main.ts
    - apps/desktop/src/app/DesktopClerk.ts
    - apps/desktop/src/app/DesktopClerk.test.ts
  verify:
    - apps/web/src/__fork_guards__/forkClerkLaunchResilience.test.ts

- id: geist-typography
  intent: >
    The app's typefaces are Geist (UI) and Geist Mono (code), bundled as
    Fontsource variable faces and imported from the fork's own theme layer —
    web and Electron renderer only; mobile and marketing still ship DM Sans.
    The stacks live in theme.custom.css as --fork-font-sans / --fork-font-mono
    and index.css's @theme block reads them through
    var(--fork-font-sans, <upstream stack>); that indirection is load-bearing,
    not ceremony. The block is @theme inline, so Tailwind bakes font values
    literally into .font-sans / .font-mono and their variants, and a compiled
    utility cannot see a variable overridden in a later stylesheet — the same
    constraint that forces the sidebar-v2 palette registrations to live in
    index.css. Routing through --fork-font-* keeps the values scoped under the
    fork marker while the fallbacks leave an unmarked build on DM Sans.
    The terminal's font logic lives in custom/terminalFont.ts rather than in
    the drawer: xterm takes its font from a constructor option instead of the
    cascade, so --font-mono has to be resolved by hand and the cell grid
    re-measured once the webfont lands — xterm sizes columns at open(), and a
    webfont can land after that. The drawer keeps two one-line call sites, and
    the font-load probe is derived from the resolved stack rather than
    hardcoded, so it cannot go stale on a face swap and an unmarked build
    names a local system face and fetches nothing. The re-fit must also
    propagate to the PTY via resizeTerminal — nothing in the drawer subscribes
    to onResize, and a re-fit that corrects only xterm's local grid leaves the
    PTY wrapping to the stale, fallback-measured width.
    Geist Mono is listed AHEAD of SF Mono: upstream puts SF Mono first, which
    means on macOS its bundled mono webfont never renders at all. body / pre,
    code are re-declared under
    the fork marker because upstream hardcodes the literal stacks on those
    selectors (index.css:964, index.css:1022) instead of reading its own
    @theme tokens, so overriding --font-sans / --font-mono alone does not
    reach them.
    DM Sans / JetBrains Mono deps and their main.tsx imports stay, and the two
    are not the same case. JetBrains Mono is load-bearing: the fork's own mono
    stack still names it as the fallback for a Linux user with no SF Mono and
    no Consolas when the Geist Mono fetch fails, and no guard would catch
    dropping the face out from under a stack that still names it — the guards
    assert the family is listed, not that a bundled face backs it. DM Sans is
    inert in a marked build and costs only installer size (~60KB, plus 96KB
    JetBrains Mono, emitted because main.tsx still imports the Fontsource
    CSS); it is left as-is to keep main.tsx conflict-free and is the one to
    revisit if package size matters.
  tier: 4
