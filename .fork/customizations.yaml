- id: mobile-current-checkout-branch
  intent: >
    A thread QUEUED OFFLINE from Mobile in Current checkout mode records the
    branch checked out at compose time, so web and desktop thread rows can
    render branch identity for outbox threads too.

    Scope shrank in the v0.0.33 sync: upstream shipped the immediate-creation
    half natively (resolveProjectThreadCreationBranch fed by
    currentCheckoutBranchName from the live status stream), which also
    retired the fork's own resolver — its availableBranches.find(current)
    source was cache-served (listRefs lags an out-of-band git switch) and
    paginated (a current branch off the loaded page silently resolved to no
    branch), and passing its result into upstream's resolver short-circuited
    the correct live source. The one surviving fence is the offline-outbox
    path, which reuses upstream's resolver and live source verbatim.

    Upstream deliberately leaves queued tasks unlabeled — a task drained days
    later runs against whatever is checked out then, so a queue-time guess
    can pin a stale label. The fork keeps the compose-time checkout anyway:
    its users triage threads from sidebar rows where an unlabeled thread
    costs more day-to-day than a rarely-stale label, and an explicit picker
    choice (which upstream does record) is exactly as stale-prone. Detached
    HEAD, non-repository projects, and an unarrived status stay null rather
    than fabricating a branch. New worktree mode still requires its explicit
    base-branch flow.
  tier: 4
  files: []
  shadows: []
  watch:
    - apps/mobile/src/features/threads/new-task-flow-provider.tsx
    - apps/mobile/src/features/threads/NewTaskDraftScreen.tsx
    - apps/mobile/src/features/threads/projectThreadCreationValidation.ts
  verify:
