- id: fork-sidebar-type-size
  intent: >
    Sidebar V2 body type is 0.8125rem (13px at the default root) for project
    headers and slim shelves. The panel remaps Tailwind's --text-xs and
    --text-sm (and their --line-height companions) to 0.8125rem / 1rem so those
    share one size without rewriting each className. Search, New thread, Add
    project, and the Projects label opt out at 0.875rem (14px) via CHROME_TYPE;
    card titles and the repo/branch line opt out with literal rem sizes
    (0.875rem / 0.75rem — see
    sidebar-v2-card-rows) so the remap cannot flatten them. Rem, not px:
    a px pin would freeze the sidebar while h-4 and the rest of the app still
    honour the browser font-size setting. Line-height stays 1rem so the card's
    h-4 rows scale with the type. Literal captions (text-[11px], text-[10px]
    for meta, ⌘K, elapsed) stay at their drawn sizes. Scoped to
    [data-sidebar-version="v2"] under the fork marker; light and dark share
    the size. Portaled menus outside the panel keep upstream sizes.

    The remap depends on two upstream facts the drift job must watch:
    apps/web/src/index.css (text scale must stay non-inline @theme so
    utilities emit var(--text-xs); moving it into this repo's @theme inline
    block would bake the values and silently ignore the override — the same
    failure geist-typography documents), and
    apps/web/src/components/AppSidebarLayout.tsx (sole site rendering
    data-sidebar-version; dropping the attribute makes the selector match
    nothing).
