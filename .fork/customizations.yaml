- id: sidebar-v2-project-grouping
  intent: >
    Sidebar V2's active cards can be grouped under project headers, from a
    switch at the top of the fork's projects filter menu. Upstream's flat list
    stays the default, and the preference is device-local (localStorage) rather
    than a field in packages/contracts.

    Both modes are one list shape. buildActiveThreadSections returns sections
    for either, flat being the single headerless section, and the render and the
    keyboard-order flattening both read that one sequence. They must never
    become two derivations that agree by convention.

    orderedThreads is the flattened section order. Three consumers are
    positional and address the wrong row if it disagrees with paint order:
    resolveAdjacentThreadId (arrow navigation), rangeSelectTo (shift-select) and
    planForwardNavigation, which picks where you land after settling or snoozing
    the thread you are viewing — under grouping that is the next card in the
    grouped order, which may be the next project's first card. The number-key
    jump labels are keyed by thread rather than by index, so they cannot
    misaddress; they are numbered from this list, so a stale order only shows
    them out of sequence down the screen.

    Only the active cards group, and only where a header says something the
    screen does not already: the snoozed and settled shelves stay flat, and
    grouping is skipped whenever one project is on screen, whether by scope or
    by the sidebar having a single project. The switch is disabled with a stated
    reason in those states rather than accepting a click that does nothing.

    Section order is projectGroups' own order and thread order inside a section
    is the order it arrives in, so grouping introduces no second notion of
    sorting and cannot disagree with the user's project sort order.

    A thread whose project resolves to no group collects in a trailing section
    whose header carries a null display name. It is never dropped, and never
    trails headerless under the previous project. The label for that section is
    the render site's, so the bucketing stays free of user-facing copy.

    A grouped card hides its project name rather than dropping it: the header
    carries it on screen, and the card keeps it for assistive tech, which has no
    "two rows up". Grouped mode must never convey less than flat mode.

    The header carries a trailing plus that starts a thread in that project. The
    chrome row's "New thread" must ask which project when there are several — it
    opens the new-thread-in palette — and a grouped header has already answered
    that question, so its plus skips the picker.

    Which environment it lands in is buildSidebarProjectPickerEntries' answer,
    reached by calling it rather than by restating it. A logical project can
    span environments, and that function prefers the member matching the thread
    you are reading, falling back to the group's canonical ref — which
    deriveSidebarProjectSnapshots picks as the primary-environment member, i.e.
    preferentially the local one. Taking that canonical ref directly is not the
    same rule: reading a remote thread of a project that also has a local
    member, the palette starts remote and the shortcut would start local. Two
    entry points into the same door must not disagree about which room they
    enter, and sharing the derivation is the only version of that which cannot
    drift back apart. The unresolved-project section names no project and so
    renders no plus — the one header without one, gated on that bucket's own
    UNGROUPED_PROJECT_KEY. Not on its label being null: the label correlates
    today, and one signal carrying two meanings is how it stops correlating.

    The heading role sits on the label span, not on the header row. The row also
    holds the collapse control and the new-thread plus, and a heading containing
    either takes that control's text into its own accessible name, so the
    landmark announcing which project a run of cards belongs to would read
    "<project> Collapse <project>" (or the plus's name). The row is a
    presentational li and the label is the heading.

    Groups collapse from the header row. Hovering anywhere on the row swaps the
    folder mark for a chevron; clicking the mark or the label toggles. At rest
    the mark is FolderOpen when expanded (Figma 113:3718 Frame 48) and
    FolderClosed when collapsed (Figma 151:6742). Collapse is an absolutely-
    positioned hit layer behind the row; the new-thread plus paints above it
    (z-10) so its clicks start a thread instead of toggling — a flex-1
    collapse sibling was eating them. Row-hover still swaps the mark when the
    pointer is over the plus; the chevron rotates to point at the label while
    collapsed. Collapsed keys persist in localStorage (device-local, like the
    grouping switch). A collapsed section hides its cards from both paint and
    keyboard order, with the open route thread kept visible — the same
    exception the snoozed shelf makes for a deep-linked row — so collapse
    cannot bury the thread you are viewing.

    The header has no own horizontal pad — the list's 8px is the edge. The
    folder sits in a 24px box so its 16px glyph centres on the same 12px axis as
    Search and each card's status; gap-1 to the label (FolderOpen at
    icon tint, the label at foreground — Figma 113:3718 Frame 48); 4px to the
    first card via the list ul's gap-1 (fork retune of Figma's 2px), and
    mt-3.5 plus that gap makes 18px between groups. The trailing plus takes
    no nudge: with no row padding to compensate for, a flush 24px button
    already centres on the trailing axis.

    The ref index is memoized on the project list alone; the thread list churns
    on the clock, capability descriptors and per-row PR states, none of which
    change which project a ref belongs to.

    Four Tier-4 fences carry this in SidebarV2.tsx: the import, the row prop,
    the section/order memos, and the render hunk. The render hunk is the one
    that sits inside upstream's own list body and so the one most likely to be
    lost in a sync; the guard test asserts it emits headers from the same
    sections it renders threads from, because a silent loss leaves a flat
    sidebar over a grouped ordered list.
