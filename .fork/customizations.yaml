- id: fork-cool-darker-sidebar-vibrancy
  intent: >
    Cool Darker — and only Cool Darker — shows the macOS desktop wallpaper
    through its sidebar, the way Cursor does. Native NSVisualEffectView
    vibrancy ("fullscreen-ui", named once in fork/ForkGlassState.ts because the
    window's construction options and the runtime call must agree), not CSS:
    backdrop-filter can only blur what is behind an element inside the page, so
    it can never reach the desktop. It started on "under-window", the darkest
    sampler macOS offers — measured through the app it returned a flat ~49 grey,
    which caps every surface above it however the stylesheet is tuned.

    The window is built with visualEffectState "active" alongside the vibrancy.
    NSVisualEffectView otherwise follows the window's active state and drops to a
    flat inactive fill whenever focus leaves the app; the CSS behind it stays
    translucent either way, so it presents as the whole app going opaque rather
    than as a window losing focus. Both options are construction-only and
    Electron requires them together.

    The main process owns the material AND the window fill for as long as the
    glass is on. apps/desktop/src/fork/ForkSidebarVibrancy.ts registers a
    fork-only IPC method on the channel fork:set-sidebar-vibrancy that calls
    setVibrancy + setBackgroundColor across every window, and returns what it
    actually applied — false on any non-darwin platform.

    The payload carries only `enabled`. The restore colour is resolved in the
    main process from nativeTheme, never sent by the renderer: the renderer
    knows the palette it is switching to, not the window fill that belongs to
    it, and an earlier cut shipped Cool Darker's stage colour on every call,
    repainting the window for Light, default Dark, Cool Dark and both Neutral
    palettes.

    The material goes on the main window alone, not every BrowserWindow: the
    preview picture-in-picture window and the WSL splash carry their own fills
    and none of the fork's CSS, so a previewed page without an opaque background
    would render see-through and restoring would repaint them with the app's
    colour.

    Glass also assumes the panel sits beside the chat column. In overlay mode
    (custom/narrowChatOverlay.ts, when pushing would take the chat column under
    its minimum width) the panel floats over the transcript instead, so the
    translucent tint is gated on :not([data-fork-sidebar-overlay="true"]) —
    otherwise message text reads through the thread rows. Opening the right
    panel is itself what triggers overlay at most window sizes, so the two
    always appear together.

    While it floats it paints an opaque neutral #1f1f1f rather than falling back
    to the palette's #181b1e. Opaque is the point of the gate; the cool cast is
    not, and against neighbouring surfaces that are all neutral rgb(22 22 22) it
    read as a different material instead of the same panel with its glass
    suspended. #1f1f1f is the docked panel's own resolved value (88% of the
    neutral tint over the material's ~99 sample), so only transparency changes
    when it lifts off the column. The seam colour is deliberately NOT gated on
    overlay: the tint asks what is behind the panel, which overlay changes, while
    the seam asks how loud its edge is, which it does not.

    Two glass rules now target the v2 panel, so the guard picks the tinted one by
    its overlay gate rather than by source order, and asserts the floating one is
    both opaque and neutral (R=G=B) — the "keep alpha" rule belongs to the docked
    block alone, since alpha is exactly what floating gives up.

    syncWindowAppearance in window/DesktopWindow.ts writes the same fill on OS
    appearance changes. Two owners of one slot means the glass dies silently
    with the renderer's marker still set, so that write is gated on
    fork/ForkGlassState.ts. The flag is its own module because both writers read
    it and importing either from the other closes a cycle. It is deliberately NOT on packages/contracts'
    DesktopBridge: preload.ts exposes it on a separate forkDesktopBridge world
    key so upstream never has to merge a contract this fork invented, and it
    imports nothing from npm so it needs no preload alwaysBundle entry.

    The renderer takes a boolean and imports nothing from forkTheme — forkTheme
    owns which palettes want glass. That direction is load-bearing: the two
    modules previously imported each other, and the cycle had to be dodged with
    call-time indirection to avoid a TDZ crash on load. Palette switches fire it
    without awaiting, so a monotonic sync id drops superseded answers rather
    than letting a stale resolution stamp a marker the user has moved past.

    The renderer trusts the resolved value, never the request.
    custom/forkSidebarVibrancy.ts stamps :root with
    data-fork-sidebar-vibrancy="true" only when the main process confirms the
    glass, and the CSS in theme.custom.palettes.css gates on that marker rather
    than on the palette. A web, remote, Linux or Windows client running Cool
    Darker therefore keeps the solid #181b1e panel instead of punching
    transparent holes into an opaque window. forkTheme.ts drives it from
    syncForkPaletteFromStorage, outside the synchronous chrome repaint, because
    it is an async IPC round trip.

    Glass is the one place the fork's flatten-alpha doctrine is suspended: an
    opaque row fill over a translucent panel renders as a rectangle of missing
    wallpaper. The sidebar panel is a single rgb(22 22 22 / 88%) tint and rows
    lift with white washes (5% hover, 8% active/selected) so the glass survives
    selection. The chat stage is a vertical gradient, rgb(22 22 22 / 95%) for its
    top 70% easing to 85% across the bottom third where the cutoff mask has already
    ended the transcript. That ramp is scoped to insets that carry the mask
    (:has(.fork-timeline-cutoff)); Settings, Usage and the empty state are the
    same element with no transcript to end, so they keep a flat 95%. SidebarInset
    carries bg-background, so the rule clears background-color explicitly — a
    background-image alone composites over that opaque fill and the glass does
    nothing. Panel and stage share one triple, so both surfaces carry a single
    cast and differ only in depth, and the seam between them reads as depth
    rather than as two materials.
    The guard pins the relationships rather than any literal value: every stage
    stop >= 80%, the reading area never below the sidebar's, and every stop of an
    unmasked inset never below it either. The licence to dip under the panel
    belongs to the fade below the mask, and only there.

    The design-mode chrome (fork-design-mode) is the second column in the inset
    to take the glass, and it paints NOTHING rather than taking a tint. The panel
    is an ordinary child of the inset, so anything it paints composites ON the
    stage and can only move it toward opaque — a wash there would make it less
    glassy than the column it docks into, and the sidebar reaches 88% against a
    95% stage only by being a paint layer outside the inset entirely. So
    --fork-design-surface is transparent, and its fields take the context chips'
    12% for the chips' own reason: with the surface painting nothing they sit on
    the bare stage, one layer lower than a composer ring. --muted matches the
    field token (only the colour picker's hex input reads it, at /40) and
    --accent is an 8% lift, which composites to ~19% over a field so a selected
    segment still reads. The layers rail was already transparent by accident — it
    carries the bg-background utility the class-based clear catches, while the
    panel used bg-[var(--fork-design-surface)], which that rule cannot reach.
    That is the whole reason one read as glass and the other as a slab, and it is
    why the two are named in one selector now.

    Two arithmetic facts govern the tuning, and both cost several rounds to
    learn the hard way:

    Vibrancy darkens and desaturates its sample before either surface
    composites over it, and how much survives is the MATERIAL's answer, not a
    constant. On "under-window" (a flat ~49 grey) the usable range was roughly
    60-90%: 91%, 97% and 98% all rendered as no glass at all rather than as
    subtle glass. "fullscreen-ui" returns ~99 and carries colour, so the same
    contribution needs a much higher alpha — the stage tops out at 95% and still
    reads as glass. Changing FORK_VIBRANCY_MATERIAL invalidates every number
    here; hold the desktop's contribution constant and redo the arithmetic.

    Alpha compounds down the tree. Anything painting a fill ON the stage
    multiplies with it — a 90% scrim over the 90% stage composites to 99%
    against the stage's own 90%, which is why the composer band stayed visibly
    flatter than the column no matter what value the scrim used. Only zero
    matches the stage, so [data-chat-composer-overlay] paints `background:
    none` under glass and the timeline cutoff mask ends the transcript above the
    composer instead of anything covering it.

    backdrop-filter and the native material are alternatives, not layers. The
    NSVisualEffectView sits behind the window, outside anything the page
    compositor owns, so Chromium cannot include it in a backdrop it filters — it
    flattens the region to composite the filter, and the element keeps its
    brightness while losing the desktop. The composer carried blur(48px)
    saturate(2.6) and measured as a channel spread of 3 against 25 in the sidebar
    and 14-20 in the stage beside it: a flat grey slab in a translucent window.
    All of them are cleared explicitly — the composer, and upstream's own
    .dropdown-glass / .dialog-glass / .alert-glass /
    .dialog-backdrop utilities, which open over the sidebar and the stage and
    flatten whatever patch they cover. Those four are made opaque in the same
    rule (--glass-opacity: 100%): without the blur a translucent menu leaks the
    text under it, which is worse than the grey card it replaces. The cutoff
    mask is what makes clearing the composer's own filter safe.

    Three separate failures in this feature all present identically, as "the
    stylesheet is not reloading":

    [data-slot="sidebar-inner"] carries bg-sidebar and is the only element that
    paints the panel tint. Clearing it along with the structural wrappers makes
    the sidebar fully transparent, so the panel opacity has nothing to apply to.

    ChatView's root and [data-chat-header] each fill the stage edge to edge with
    an opaque bg-background. Either one covers the stage tint at any alpha, so
    the stage clears .bg-background descendants by class rather than naming
    them — enumerating them meant every new opaque child was a silent
    regression. Not solved by redefining --background under the marker: every
    bg-background user would then paint its own translucent fill and nested
    ones would multiply. Glass has to be exactly one layer.

    The switch thumb is excluded from that clear. It carries bg-background as
    its visible foreground fill, not as an edge-to-edge surface; clearing it
    makes the thumb transparent over the white checked track and reduces the
    control to a featureless white pill.

    `.bg-card` gets the same class treatment but a wash rather than a clear:
    --card is an opaque #1c1f22 and about thirty components paint it inside the
    inset, the right panel's "Open a surface" tiles most visibly, each reading as
    a rectangle of missing wallpaper. 5% white, matching the changed-files card
    so the two read as one kind of surface, and scoped to the inset because the
    sidebar block redefines --card to the panel tint. The user's sent bubble
    (`.bg-message`, painted from --card by fork-changed-files-card) takes the
    same 5% wash under glass, unlayered since it carries no hover/focus fill.

    That one rule is deliberately the ONLY glass rule that does not outrank what
    it overrides, and it is the exception that proves why the others can. Every
    other rule here is unlayered and marker-scoped, so it beats anything in
    Tailwind's layers whatever the specificity — which is correct for a fill
    nothing else contends for, and wrong the moment the element also carries a
    state utility. Written that way the wash beat `hover:bg-accent/60` too and
    the surface tiles simply stopped responding to the pointer: not a wrong
    colour, but interaction feedback disappearing silently. So it sits in
    `@layer utilities` with the marker wrapped in `:where()`, making the whole
    selector (0,1,0) — a tie with `.bg-card` that source order wins, and a loss
    to every (0,2,0) state variant, so hover/focus/active keep working without
    being enumerated. A guard pins both the layer and the :where().

    Redefining --card under the marker is the tidier-looking fix and is the same
    trap as --background: index.css derives --surface-raised, --code-background
    and a ring inset from it, so a wash there takes the transcript's code blocks
    with it. Guarded — no inset-scoped glass rule may declare --card.

    Known and NOT fixed here: the `.bg-background` clear has the same precedence
    shape, so an element carrying both `bg-background` and a hover background
    (ThreadTerminalDrawer's button, KeybindingsSettings' row) loses that hover
    under glass. It predates this pass and the fix is the same layer treatment;
    it is left alone rather than restructured blind, since the clear is load
    bearing for the stage and nothing here can verify it visually.

    That class match has one blind spot, and it is the one the clear cannot fix
    for itself: a utility declared as `@apply ... bg-background` inlines the fill
    INTO its own rule, so the element never carries .bg-background and nothing
    matches it. .surface-subheader is that case — the preview's browser bar, the
    diff and file panel headers and the PR code tab all painted an opaque slab
    across a translucent column. It is named explicitly beside .bg-background,
    and a guard reads the @apply-ed utilities back out of index.css so a new one
    fails the test instead of shipping a slab.

    A value above ~90% is invisible rather than subtle. Verify with computed
    styles before concluding a rule is not applying — and read background-image
    and ::before/::after, not just background-color, or gradient scrims and
    pseudo-elements stay invisible to the search.

    Hover and selected fills under glass are white washes, not the palette's
    opaque cool --accent: the stage is a neutral tint with the wallpaper's
    cast, the cards are washes and the popups stand on the warm floor, so an
    opaque #282d30 on any of them reads as a bluish slab instead of the
    surface lifting. The glass root block and the docked panel block both
    restate --accent (and the header pills' --fork-pill-hover) as
    rgb(255 255 255 / 8%), which lands on the stage where the opaque token
    used to, so upstream's bg-accent/N variants keep their relative weight.

    Must not alter Cool Dark, Neutral Dark, Neutral Darker, or default Dark,
    and must not make the window transparent for any other palette.
