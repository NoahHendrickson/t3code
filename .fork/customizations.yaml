- id: fork-upstream-names
  intent: >
    Every name a fork stylesheet borrows from upstream — a CSS variable it
    reads with var(), a data attribute or data-slot value it selects, a
    class it targets — still exists somewhere in apps/web. None of these is
    a typed contract, so an upstream rename compiles clean and simply
    un-matches the fork rule; an unresolved var() is worse, because it
    invalidates the whole declaration around it at computed-value time
    (that is how the timeline cutoff vanished when #8799 renamed
    --topbar-scroll-fade-height). The guard resolves each referenced name
    against the web source, Tailwind's default theme, and a short allowlist
    of names libraries stamp at runtime (Base UI positioner variables and
    tooltip-trigger attribute), so a rename in a sync PR turns CI red
    instead of shipping a dead rule. It asserts existence only, never
    meaning: a token whose value changed semantics still needs the guard
    that owns that customization.
  tier: 1
  files:
    - apps/web/src/__fork_guards__/forkUpstreamNames.test.ts
  shadows: []
  watch:
    - apps/web/src/index.css
  verify:
    - apps/web/src/__fork_guards__/forkUpstreamNames.test.ts

- id: fork-popup-surface
  intent: >
    Popup menus (menu, select, combobox and popover popups — the model
    picker among them) paint the same material as the Questions card and
    the prompt surface: the composer fill layered over the vessel floor over
    the stage, with the composer hairline, instead of upstream's blurred
    translucent --popover tint under a 10% contrast border. Layering the
    palette's own tokens keeps the value in step with every palette and
    opaque (the stage always is), and the backdrop blur goes with nothing
    left to see through. Under Cool Darker glass (theme.custom.palettes.css)
    the composer is alphas over a wallpaper-lit stage, so the same two
    alphas there stand on --fork-popup-glass-floor — the stage as it reads
    on screen, measured, opaque — instead of the bare --background tint;
    the menu lands on the Questions card's colour without going
    translucent, which would show the transcript through it. Dark only;
    keyed on upstream's popup data-slot names, no upstream fence. One
    selector arm per primitive, because each stamps dropdown-glass on a
    different node: menu and popover on the popup itself, select on a child
    of it, combobox on the wrapper span around it. Menu, select and
    combobox rows hover with the selected row's 8% foreground wash (12% on
    a selected or checked row) instead of --accent: the fork palettes make
    --accent an opaque grey that is the popup's own fill on the Cool
    palettes (hover vanished) and a bluish slab on the wallpaper-tinted
    floor under Cool Darker glass, and it never matched the branch
    picker's "current" row. An alpha lifts whatever the popup paints.
