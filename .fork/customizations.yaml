    # shared (see intent), but the desktop-entry FILENAME collides with an
    # installed upstream release's — last writer wins. Revisit before any
    # packaged Linux fork release.
    - apps/desktop/src/app/DesktopLinuxUrlHandler.ts
    - apps/desktop/src/backend/DesktopBackendConfiguration.ts
    - apps/desktop/scripts/electron-launcher.mjs
    # Fenced icon-path assertions matching the launcher's fork art.
    - apps/desktop/scripts/electron-launcher.test.mjs
    - apps/server/src/config.ts
    - apps/web/src/branding.ts
    - apps/web/src/branding.test.ts
    - apps/web/src/components/sidebar/SidebarChrome.tsx
    - apps/web/public/apple-touch-icon.png
    - apps/web/public/favicon-16x16.png
    - apps/web/public/favicon-32x32.png
    - apps/web/public/favicon.ico
    # Upstream retired the static desktop resource icons in the v0.0.33 cycle;
    # source-tree icon resolution (incl. the darwin dev dock icon) moved into
    # DesktopAssets, which the fork fences onto assets/fork.
    - apps/desktop/src/app/DesktopAssets.ts
    - apps/desktop/src/app/DesktopAssets.test.ts
    - packages/shared/src/devHome.ts
    - packages/shared/src/hostProcess.ts
