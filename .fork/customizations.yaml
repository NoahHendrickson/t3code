- id: phosphor-duotone-icons
  intent: >
    The app's iconography is Phosphor at the duotone weight, not lucide.
    Rather than rewriting ~89 import sites across the hottest upstream files
    (ChatView, SidebarV2, ChatComposer), "lucide-react" is aliased to a
    fork-owned shim that re-exports Phosphor under lucide's export names. Call
    sites keep importing "lucide-react" verbatim, so upstream can add, move, or
    delete icon usage freely and this fork inherits it. Glyphs with no enclosed
    area (carets, checks, arrows, spinners) are pinned to the bold weight,
    since duotone is indistinguishable there and reads too light against
    lucide's 2px stroke. The shim also reproduces lucide's `lucide lucide-<name>`
    SVG classes, because upstream tests assert them to identify which icon
    rendered — honouring the contract keeps those tests passing unmodified
    instead of forcing Tier 4 edits into upstream test files.
  tier: 1
  files:
    - apps/web/src/custom/icons/lucide-phosphor.tsx
  shadows: []
  watch:
    - apps/web/vite.config.ts
    - apps/web/tsconfig.json
  verify:
    - apps/web/src/__fork_guards__/phosphorIcons.test.ts

- id: sidebar-v2-card-rows
  intent: >
    Sidebar V2 thread rows are two-line cards at 12px radius, drawn at a fixed
    52px: a title line (status mark, prompt, then a trailing group carrying the
    PR number and the elapsed time) and a repo line whose two halves sit in
    fixed corners — project and branch on the left, model label and runtime
    glyph on the right. Fixed corners are the point: the two things you compare
    across rows, which checkout a thread is on and what is running it, are then
    always at the same x. Slim shelf rows keep the 8px --radius-md they were
    drawn at; 12px on a 36px row reads as a pill rather than as a card.
    Upstream's terminal-status glyph (#4712) rides the repo line after the
    branch cluster, handed in pre-built as a required `terminalSlot` — required
    so a sync resolution that drops the call-site line fails the typecheck
    instead of silently un-porting the feature from the card variant. The
    project's favicon leads the repo line the same way, as a required
    `projectIconSlot` built on the row's side from upstream's ProjectFavicon
    (the slim rows and the project menu already draw it), with the design's
    folder mark as the in-component fallback for a null slot.

    Surface encodes interaction and nothing else. A row is filled on hover and
    when selected or routed to; it is never filled because of its status.
    Done and Idle recede their title colour at rest (restored on hover or
    selection), per the component set — Working, Approval, Input and Failed
    keep the foreground title. Every title is Regular at 0.875rem (14px);
    colour alone carries the receded/forward distinction, which is why
    receded titles use --fork-sidebar-card-title-receded (#c0c0c0) rather
    than lifting the shared --muted-foreground channel (see
    fork-surface-palette). The size is literal on threadCardTitleClassName so
    the panel's --text-xs/--text-sm remap to 13px cannot shrink it. The repo
    line (project + branch) is 0.75rem (12px) for the same reason. A card's
    surface reads the same Done/Idle predicate as its title (`cardRecedes`);
    upstream's shouldRecede survives for the slim shelves only, where
    brightness still encodes unread-ness — the card delegates unread to the
    Done dot.

    Status text labels ("Working", "Approval", "Monitoring") are replaced by a
    single mark in a fixed 16px leading box on the title line, and the box is
    never empty — idle draws a hollow ring rather than falling back to a
    variable-width relative-time string, so the title text and the row below
    share one left edge. The marks inside keep their own sizes and centre in
    the box (the rain is 14px tall, a status dot 8px), so the box can set the
    row's left edge without resizing them. The repo line indents 20px so it
    aligns under the prompt rather than under the mark. The mark's form carries
    the state — falling pixels while the agent
    runs, a static dot once it stops, a slow white opacity breath (50% → 20%)
    while monitoring, a clock for woke, a ring for idle — and the hue only
    reinforces it. The monitoring breath is duty-cycled and stepped (same
    compositor contract as upstream ghost-pulse / status-pulse): long holds
    with a short steps(4) ramp, opacity-only, contain:paint, no will-change —
    so it does not repaint every vsync on high-refresh displays. Working is
    emerald, deliberately diverging from the sky the mobile Live Activity
    still uses; mobile has not been migrated.

    The PR badge, the working duration and the hover actions share the title
    line's trailing group. Status no longer shares that cell, so the
    opacity-crossfade hit-path bug that used to eat settle clicks cannot
    return. The badge is not inside the stack that fades the duration out on
    hover: it is a link to the PR, and a control you can reach only by not
    pointing at its row is not a control.

    Card metrics from Figma t3-fork nodes 113:725 (the card) and 293:20603
    (the list): px-4 py-8 (4/8), 2px between the two rows. The title line is
    18px — the 14px prompt's own line box — and the repo line 16px, so the
    card draws at 8+18+2+16+8 = 52. The status box is 16px and the gap to the
    prompt 6px, which puts the prompt 34px in: the same edge as the group
    header label (24px folder box + its 2px gap). List pad 8 plus the card's
    px-1 puts that status box 12px in, centring its mark at 20 — the same axis
    as Search and the group folder icon. The repo line indents 20px.
    Cards sit 2px apart on the list ul's gap-0.5; the li itself carries no
    padding, so contain-intrinsic-size is the drawn 52 exactly. Branch,
    worktree and project marks are 16px; the runtime glyph stays 14px in a 24px
    box flush with the card edge so it shares the settle/discard centre on the
    trailing axis (a lone 14px + pr-[3px] was 2px off once actions grew to
    size-6). The model label is caption 11/15. The PR badge is 12px, literal so
    the panel's --text-xs remap cannot grow it past the duration beside it, and
    carries pe-1 for the design's 4px — spent between badge and duration, or to
    the card's content edge when it is alone. Project and branch read at
    --muted-foreground with the model cluster a step behind at 70%, so the
    checkout stays the brighter of the two without matching the prompt.

    The leading column's numbers are derived in custom/sidebarV2CardAlignment,
    the way the trailing column's already were: the status box, the title gap,
    the repo indent, the list gap and the project header's box, gap and margins
    all live there with the arithmetic that ties them together. One invariant
    justifies the module — a card's prompt and a project header's label start at
    the same 34px, reached from two different sides (list pad 8 + card px-1 +
    status box 16 + title gap 6, against list pad 8 + mark box 24 + gap 2) — and
    the guard asserts that equality rather than the three class strings, so
    retuning one side without the other fails instead of silently drifting. The
    repo indent is deliberately 2px left of the prompt, per the design, and is
    pinned as that difference.

    Five margins hang off the list gap, not one, and all five are derived in
    that module: the project header's lead and trail, the pinned divider's, and
    the snoozed/settled shelf headers' above and below. The last three keep the
    totals they had before the gap halved (10px a side, 16px, 8px) — the design
    draws neither shelves nor the pinned divider, so letting a card retune
    tighten them would be a side effect rather than a decision. The guard pins
    all five as totals, so changing the gap alone fails.

    Every card is that one height, whatever it carries. It used to grow a third
    line for the PR badge and the turn's diff counts, which meant predicting
    that line's presence before the per-row VCS query answered — and the list
    reflowed under the pointer as those queries landed. The component set moved
    the PR to the title line and dropped the diff counts, so there is no longer
    a row whose presence has to be guessed; `prUnknown` and the predicate that
    read it are gone with it. Nothing else varies the height either: an absent
    branch or model leaves its half of the line empty rather than closing it
    up. Retune the card's vertical padding, its row gap, or either row's height
    and the intrinsic-size hint moves with them, or the scrollbar misreports
    every skipped row by the difference.

    Upstream's `latestTurnDiff` stub went out with the diff counts. It always
    returned null (shells carry no checkpoint summaries) and the fork card was
    its only caller; a fenced note stands where it was, so a sync that grows
    the field has somewhere to land.

    A thread that runs in a worktree of its own draws a worktree mark where the
    branch mark otherwise goes — replacing it, not joining it. That slot already
    answers "which code is this on", and the two facts are not independent: a
    thread on a worktree is on that worktree's branch, so a second glyph would
    spend ~16px of a line whose branch name is already capped and truncating to
    restate what the first implies. The predicate is the one the row's own git
