# Register of every intentional deviation from upstream — see .fork/README.md §4a.
#
# This file is read by two consumers:
#   - .fork/detect-drift.mjs (Layer 1 CI) — flags upstream commits touching
#     watched files
#   - the daily sync routine — reads `intent` before resolving any conflict,
#     so it preserves the intent rather than the literal old lines
#
# Format constraints (the parser is dependency-free and line-based — keep it
# simple):
#   - each entry starts with `- id: <slug>` at column 0
#   - list keys (files/shadows/watch/verify) are two-space indented, one
#     `- <path>` per line beneath them; use `[]` for an empty list
#   - `intent:` is `>`-folded free text; don't start intent lines with `-`
#
# Keys:
#   files:   fork-owned files implementing the customization (Tier 1/2 paths;
#            upstream never touches these)
#   shadows: upstream modules replaced via src/overrides/ — drift-watched
#   watch:   upstream files carrying Tier-4 inline edits — drift-watched
#   verify:  guard tests that fail if the customization is silently lost
#
# Keep `intent` to the invariants a sync must preserve. Design history,
# rejected alternatives, and incident write-ups live in
# .fork/notes/FORK-CUSTOMIZATION-DECISIONS.md — narrative there, contract here.

- id: ci-on-custom
  intent: >
    CI runs on pushes to custom and does not run on pushes to main. Custom is
    this fork's working branch, so a push to it (like a merged sync) must be
    validated the way main is upstream. Main is the opposite: a pure upstream
    mirror whose every commit upstream CI already validated, so running the
    fork's CI there is pure spend — and since the mirror push authenticates
    with a deploy key (see fork-sync-mirror.yml), which unlike GITHUB_TOKEN
    does trigger push workflows, main must stay out of the push trigger list
    or every hourly mirror advance schedules a full CI run.
  tier: 4
  files: []
  shadows: []
  watch:
    - .github/workflows/ci.yml
  verify:
    - apps/web/src/__fork_guards__/ciOnCustom.test.ts

- id: ci-runners
  intent: >
    CI jobs run on GitHub-hosted runners (ubuntu-latest / macos-latest) with
    30-minute timeouts. Upstream targets Blacksmith runners, whose GitHub app
    is installed on pingdotgg but not on this fork, so upstream's labels queue
    forever here. If Blacksmith is ever installed on the fork, this
    customization can be retired wholesale.

    Upstream tests tuned to Blacksmith's speed can sit close enough to their
    timeout to fail deterministically on the slower hosted runners; those get
    a fenced per-test timeout raise rather than a product change, because the
    underlying cost is upstream's to fix and diverging in hot upstream logic
    buys a conflict on every sync. Current carrier: imageCompression.test.ts's
    give-up path (~15 encodes of an 8 MB stub through chunked base64 —
    deterministic work, not flake). session-logic.test.ts's 20,000-entry
    work-log benchmark carried one until upstream #8585 dropped its timing
    assertion. No guard asserts these hunks; losing one turns CI red by
    itself, which is the enforcement.
  tier: 4
  files: []
  shadows: []
  watch:
    - .github/workflows/ci.yml
    - .github/workflows/mobile-fingerprint-check.yml
    - apps/web/src/lib/imageCompression.test.ts
  verify:
    - apps/web/src/__fork_guards__/ciRunners.test.ts

- id: fork-workflow-docs
  intent: >
    Every coding agent that opens this repo learns the fork rules before
    changing anything: AGENTS.md (and its CLAUDE.md symlink) carries a fenced
    Fork Workflow section pointing to .fork/AGENTS.md, which defines the
    branch model (work from custom, never touch main) and the placement
    ladder for fork changes.
    AGENTS.md also carries the fork-authored Change Scope section, fenced as
    fork-change-scope, and it must sit ahead of upstream's first section
    heading: it is the scope contract an agent reads before upstream's own
    guidance, not an appendix. Upstream owns the rest of the document — a sync
    takes upstream's rewrite wholesale and re-seats these two fenced sections,
    Change Scope at the top and Fork Workflow at the bottom.
    CLAUDE.md is a Tier-4 inline edit the fork owns outright, and it
    deliberately diverges from the blob upstream ships. Upstream's committed
    symlink target carries a trailing newline, so it names a file that cannot
    exist and CLAUDE.md resolves to nothing — upstream fixed that in 5e13f5357
    and reintroduced it in 6891c77d3, so it recurs. The fork's blob is the
    9-byte target with no newline. Resolve any sync conflict on CLAUDE.md by
    keeping the fork's side; taking upstream's restores the bug and silently
    strips the rules from every Claude agent. It is the one Tier-4 edit that
    cannot carry the usual begin/end fence comments: a symlink's blob is its
    target verbatim, so a comment marker inside it would break the very link
    the marker exists to describe. The watch entry is the whole fence.
  tier: 4
  files:
    - .fork/AGENTS.md
  shadows: []
  watch:
    - AGENTS.md
    - CLAUDE.md
  verify:
    - apps/web/src/__fork_guards__/forkWorkflowDocs.test.ts

- id: release-upstream-only
  intent: >
    The Release workflow never runs on this fork. Upstream releases on a
    3-hourly cron and on version tags, publishing the CLI to npm and cutting
    GitHub Releases; neither is this fork's job, and the fork has no npm or
    release credentials. Both entry-point jobs (check_changes, preflight) are
    gated on the repository being upstream, and every downstream job already
    requires preflight to have succeeded, so the gate cascades to the whole
    workflow. Until this gate existed the runs did not publish only because
    they hung forever on Blacksmith runners the fork cannot schedule (see
    ci-runners) — an accident, not a safeguard. Keep the gate independent of
    the runner labels so retiring ci-runners can never start publishing from
    the fork.
  tier: 4
  files: []
  shadows: []
  watch:
    - .github/workflows/release.yml
    # PR-label macOS preview builds (#8182): gated at build and cleanup.
    - .github/workflows/desktop-macos-preview.yml
  verify:
    - apps/web/src/__fork_guards__/releaseUpstreamOnly.test.ts

- id: relay-upstream-only
  intent: >
    The relay production deploy never runs from this fork. deploy-relay.yml
    fires on every push to main and deploys with live Cloudflare, PlanetScale,
    Clerk and APNs credentials; on the fork a push to main is the hourly
    mirror advancing over unreviewed upstream code, authenticated by a deploy
    key that — unlike GITHUB_TOKEN — does trigger push workflows. Before this
    gate existed the runs were stopped only by the same two accidents
    release-upstream-only records: Blacksmith runner labels the fork cannot
    schedule, and token loop-prevention the deploy key retired. Gate the job
    on the repository being upstream, independent of runner labels, so
    installing Blacksmith here can never start deploying production from the
    fork.
  tier: 4
  files: []
  shadows: []
  watch:
    - .github/workflows/deploy-relay.yml
  verify:
    - apps/web/src/__fork_guards__/relayUpstreamOnly.test.ts

- id: fork-desktop-release
  intent: >
    The fork can cut its own downloadable desktop build without borrowing any
    part of upstream's release identity. Upstream's Release workflow deploys
    the production Cloudflare relay, publishes the CLI to npm, signs with
    upstream's Apple and Azure certificates and announces to upstream's
    Discord; release-upstream-only gates all of that off here, so the fork
    needs a path of its own. fork-release.yml builds macOS arm64 unsigned and
    publishes to this repository's Releases, using only the automatic
    GITHUB_TOKEN. Two properties matter more than the build itself: it runs on
    workflow_dispatch alone, so no sync, tag or cron can ever publish from the
    fork by surprise; and it must never grow a package-registry publish step,
    because the fork builds under upstream's package names. Signing is absent
    on purpose, not by oversight — the build script already degrades when the
    Apple secrets are missing, so adding them later is a change to one step.
  tier: 1
  files:
    - .github/workflows/fork-release.yml
    - .github/scripts/launch-isolation-check.sh
  shadows: []
  watch:
    # ci.yml carries a fenced fork hunk: release_smoke lints the isolation
    # gate script on every PR, so a defect there costs a check, not a build.
    - .github/workflows/ci.yml
  verify:
    - apps/web/src/__fork_guards__/forkDesktopRelease.test.ts

- id: fork-app-identity
  intent: >
    A packaged fork build is a different application from an installed
    upstream release, and the two never share state. Both are non-development
    builds, so every identity upstream derives from "is this a dev build"
    collapses onto the same value for both — bundle id, /Applications path,
    the ~/.t3 state tree, and the Electron user data directory — and a fork
    build would otherwise offer to replace the real app and adopt its live
    database. legacyUserDataDirName is redirected too, so a fork build never
    adopts the legacy directory upstream migrates from.
    The fork presents as "no3y Code": bundle id com.t3tools.t3code.fork,
    installs as "no3y Code.app", ships no3y-Code-* artifacts, packages the
    green-grid mark from assets/fork on all three platforms (plus web splash
    and favicon), and keeps all filesystem state under ~/.t3-fork. The bundle
    id and the base directory are the stable identities and must never change
    across display renames; display strings are safe to rename precisely
    because those two are held stable.
    Isolation is forked at the base directory, not the "userdata" leaf,
    because the packaged app is two processes: the desktop resolves its own
    state directory and hands only baseDir (as bootstrap t3Home) to the
    bundled server child, which independently derives its stateDir, caches/
    and worktrees/ from it. Moving the base keeps both halves on upstream's
    own leaf derivations and isolates all three shared directories at once,
    with no fork hunks in apps/server. What must stay true is that no fork
    surface resolves to upstream's live ~/.t3/userdata. An explicit
    T3CODE_HOME still overrides the fork base on both halves, with one refused
    value: upstream's own ~/.t3, which a non-development build rejects at
    startup rather than opening the real app's database.
    Development paths carry no fork rename — `vp dev` in this repo is already
    the fork — but since upstream a17cbc3b4, dev state in a linked git
    worktree is the worktree's own gitignored .t3 with a userdata leaf
    (dev-runner exports it as T3CODE_HOME, so the server reads the base as
    explicit). Because baseDir also carries caches/ and worktrees/, a
    worktree's session checkouts land inside the repo tree, which is why .t3
    is excluded from the test, fmt and lint discovery lists in vite.config.ts
    and from the four .repos exclusions in .vscode/settings.json, the way
    .repos already was.
    The rendered app carries the name too: the sidebar brand reads
    APP_BASE_NAME, drops the T3 wordmark, and pairs the name with the
    designer-exported 24px pixel mark owned by fork-sidebar-chrome.
    branding.ts's bridge-less fallback points at the fork's own constant
    instead of upstream's "T3 Code". Splash and favicon also ship from assets/fork (copied into
    apps/web/public for local/dev and into the packaged desktop client at
    build time via FORK_WEB_ICON_ASSETS + the shared applyWebIconOverrides
    path). The layered Icon Composer projects in assets/fork/app-icon.icon and
    assets/fork/dev-app-icon.icon are the Figma source of truth (file t3-fork,
    node 168:6364), so the surrounding tile receives the system Liquid Glass
    treatment on macOS without rasterizing the mark. Production keeps the Figma
    green background; development uses orange so installed variants remain
    distinguishable in the Dock. Glass stays off on the mark layer itself so
    the pixel grid remains crisp; the system treatment belongs to the
    surrounding tile. The macOS Dock
    exports add only a transparent outer canvas around the rendered artwork,
    preserving the pixel art while matching the standard Mac icon footprint.
    The local dev splash and favicons use the same orange family, while packaged
    builds stamp the green production family. The Linux PNG and Windows ICO are
    derived from the release 1024 render (the ICO embeds PNG entries at
    16–256px), so every packaged channel carries the same artwork. Filenames
    still say n3-* for path stability.
    Deliberately shared: the t3code:// URL scheme stays shared (it is the
    app's own internal origin, not just a deep-link handler — two installed
    apps contend for it, untidy but not destructive).
    Known carve-out: the WSL backend bootstrap deliberately omits t3Home, so
    WSL-side state is not isolated by this customization.
    Known carve-out: hosted web (`apps/web/vercel.ts`) still runs
    apply-web-brand-assets.ts with the Vercel channel and stamps upstream
    production/nightly icons over the fork public/ set at deploy time.
    Known carve-out: `npx t3` publish (`apps/server/scripts/cli.ts`
    preparePublishIcons) still resolves upstream icons via
    resolveWebAssetBrandForPackageVersion into dist/client.
    Known conflict: `pnpm icons:export` writes blueprint development art
    into apps/web/public via DEVELOPMENT_PUBLIC_ICON_OVERRIDES; after a
    brand export the fork public icons must be re-copied from assets/fork
    (or icons:check will report them stale / the byte-equality guard fails).
    History — the v0.1.1 leaf-rename incident, the N3→no3y rename, and the
    pre-a17cbc3b4 dev-state claim — is in
    .fork/notes/FORK-CUSTOMIZATION-DECISIONS.md.
  tier: 4
  files:
    - apps/web/src/custom/forkBranding.ts
    - assets/fork/app-icon.icon/Assets/mark.svg
    - assets/fork/app-icon.icon/icon.json
    - assets/fork/dev-app-icon.icon/Assets/mark.svg
    - assets/fork/dev-app-icon.icon/icon.json
    - assets/fork/n3-macos-1024.png
    - assets/fork/n3-macos-dock.png
    - assets/fork/n3-dev-macos-1024.png
    - assets/fork/n3-dev-macos-dock.png
    - assets/fork/n3-universal-1024.png
    - assets/fork/n3-windows.ico
    - assets/fork/n3-dev-web-apple-touch-180.png
    - assets/fork/n3-dev-web-favicon-16x16.png
    - assets/fork/n3-dev-web-favicon-32x32.png
    - assets/fork/n3-dev-web-favicon.ico
    - assets/fork/n3-web-apple-touch-180.png
    - assets/fork/n3-web-favicon-16x16.png
    - assets/fork/n3-web-favicon-32x32.png
    - assets/fork/n3-web-favicon.ico
  shadows: []
  watch:
    - apps/desktop/src/main.ts
    - apps/desktop/src/app/DesktopApp.ts
    - apps/desktop/src/app/DesktopAppIdentity.test.ts
    - apps/desktop/src/app/DesktopEnvironment.ts
    - apps/desktop/src/app/DesktopEnvironment.test.ts
    # The v0.0.32 pre-ready refactor: identity and state-dir logic that never
    # reads DesktopEnvironment, so fork values are restated there under
    # fences. The sync that introduced these files shipped WM class "t3code"
    # and a ~/.t3 settings read unnoticed — hence the watch.
    - apps/desktop/src/app/DesktopStatePaths.ts
    - apps/desktop/src/app/DesktopEarlyElectronStartup.ts
    - apps/desktop/src/app/DesktopEarlyElectronStartup.test.ts
    - apps/desktop/src/app/DesktopPreReadyPlatform.ts
    # Unfenced known carve-out: on packaged Linux this registers upstream's
    # t3code-url-handler.desktop in ~/.local/share/applications and claims
