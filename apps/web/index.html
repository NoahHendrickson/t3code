<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <!-- fork:begin fork-surface-palette — see .fork/customizations.yaml#fork-surface-palette
         The dark pre-paint stays on the fork stage's #161616; upstream moved
         to #0a0a0a, which flashes near-black against the hydrated #191919. -->
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <!-- fork:end fork-surface-palette -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        /* fork:begin fork-surface-palette — see .fork/customizations.yaml#fork-surface-palette */
        const DARK_BACKGROUND = "#161616";
        /* fork:end fork-surface-palette */
        /* fork:begin fork-cool-dark-theme — see .fork/customizations.yaml#fork-cool-dark-theme */
        // Fork palettes: data-fork-theme value → pre-paint background (each
        // hex matches that palette's stage `--background`). Every palette
        // contributes one fenced row; the stamping below reads the map, so a
        // new palette is a row here — not another boolean, branch, and
        // ternary arm.
        const forkPaletteBackgrounds = { "cool-dark": "#1c1e20" };
        /* fork:end fork-cool-dark-theme */
        /* fork:begin fork-neutral-dark-theme — see .fork/customizations.yaml#fork-neutral-dark-theme */
        forkPaletteBackgrounds["neutral-dark"] = "#1f1f1f";
        /* fork:end fork-neutral-dark-theme */
        /* fork:begin fork-neutral-darker-theme — see .fork/customizations.yaml#fork-neutral-darker-theme */
        forkPaletteBackgrounds["neutral-darker"] = "#1a1a1a";
        /* fork:end fork-neutral-darker-theme */
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          /* fork:begin fork-cool-dark-theme — see .fork/customizations.yaml#fork-cool-dark-theme */
          // Fork palettes live in t3code:fork-theme; migrate legacy t3code:theme=cool-dark.
          let forkPalette = window.localStorage.getItem("t3code:fork-theme");
          if (storedTheme === "cool-dark") {
            window.localStorage.setItem("t3code:theme", "dark");
            window.localStorage.setItem("t3code:fork-theme", "cool-dark");
            forkPalette = "cool-dark";
          }
          const theme =
            storedTheme === "cool-dark"
              ? "dark"
              : storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
                ? storedTheme
                : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          const activeForkPalette =
            theme === "dark" &&
            Object.prototype.hasOwnProperty.call(forkPaletteBackgrounds, forkPalette)
              ? forkPalette
              : null;
          document.documentElement.classList.toggle("dark", isDark);
          if (activeForkPalette !== null) {
            document.documentElement.setAttribute("data-fork-theme", activeForkPalette);
          } else {
            document.documentElement.removeAttribute("data-fork-theme");
          }
          const chromeColor =
            activeForkPalette !== null
              ? forkPaletteBackgrounds[activeForkPalette]
              : isDark
                ? DARK_BACKGROUND
                : LIGHT_BACKGROUND;
          /* fork:end fork-cool-dark-theme */
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html.dark body {
        /* fork:begin fork-surface-palette — see .fork/customizations.yaml#fork-surface-palette
           This body rule is what actually paints the pre-hydration viewport
           (#boot-shell inherits it); it must agree with the fenced metas and
           DARK_BACKGROUND above, not upstream's near-black. */
        background: #161616;
        /* fork:end fork-surface-palette */
        color: #f5f5f5;
      }

      /* fork:begin fork-cool-dark-theme — see .fork/customizations.yaml#fork-cool-dark-theme */
      html.dark[data-fork-theme="cool-dark"] body {
        background: #1c1e20;
        color: #e9eaec;
      }
      /* fork:end fork-cool-dark-theme */

      /* fork:begin fork-neutral-dark-theme — see .fork/customizations.yaml#fork-neutral-dark-theme */
      html.dark[data-fork-theme="neutral-dark"] body {
        background: #1f1f1f;
        color: #e8e8e8;
      }
      /* fork:end fork-neutral-dark-theme */

      /* fork:begin fork-neutral-darker-theme — see .fork/customizations.yaml#fork-neutral-darker-theme */
      html.dark[data-fork-theme="neutral-darker"] body {
        background: #1a1a1a;
        color: #e8e8e8;
      }
      /* fork:end fork-neutral-darker-theme */

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>T3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
