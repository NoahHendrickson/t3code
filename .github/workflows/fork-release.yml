name: Fork Release

# Fork-owned workflow — see .fork/customizations.yaml#fork-desktop-release.
#
# Upstream's Release workflow builds under upstream's identity: it deploys the
# production Cloudflare relay, publishes the CLI to npm, signs with upstream's
# Apple and Azure certificates, and announces to upstream's Discord. None of
# that belongs to this fork, which is why release-upstream-only gates it off
# here entirely.
#
# This is the fork's own path to a downloadable build. It shares nothing with
# upstream's pipeline but the build script, signs and notarizes with the fork
# owner's own Apple Developer ID, and only ever runs when a human dispatches it.
#
# Signing is required, not optional: installed apps update themselves from
# these releases through Squirrel.Mac, which refuses any update not signed by
# the same identity as the running app. An unsigned release here would be a
# dead end for every signed install.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.0 or 0.1.0-fork.1)"
        required: true
        type: string
      prerelease:
        # Installed apps only see the repository's latest release, so a
        # prerelease is skipped by the in-app updater.
        description: "Mark the GitHub Release as a prerelease (installed apps will not update to it)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build and run the launch isolation gate without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Dry runs get their own lane so iterating on the gate never queues behind
  # (or blocks) a real publish.
  group: fork-release-${{ inputs.dry_run }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS arm64
    # This file is fork-owned, so upstream should never see it. Belt and braces
    # in case it ever travels: the fork must be the only place it can run.
    if: github.repository == 'NoahHendrickson/t3code'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # electron-builder writes the updater feed into the app from this. Without
      # it a fork build would resolve GITHUB_REPOSITORY implicitly; setting it
      # explicitly makes it visible that installs update from THIS repo's
      # releases and never from upstream's.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          version="${raw#v}"
          # Same shape upstream's preflight accepts, so a fork tag can never be
          # a string electron-builder will choke on halfway through a 20-minute
          # build.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists. Pick a new version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.meta.outputs.version }}"

      - name: Build desktop artifact
        shell: bash
        env:
          # Developer ID Application certificate (base64 .p12) and its password;
          # electron-builder imports it into a temporary keychain.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # App Store Connect API key for notarization. APPLE_API_KEY holds the
          # .p8 contents; electron-builder wants a path, written below.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing repository secret $name; fork releases must be signed and notarized." >&2
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.meta.outputs.version }}" \
            --signed \
            --verbose

      - name: Verify signature and notarization
        # Checks the zip the in-app updater downloads, so a release that would
        # still need the quarantine workaround, or that Squirrel.Mac would
        # refuse, never publishes. The output is matched rather than trusting
        # exit codes: hosted runners may disable Gatekeeper, which makes spctl
        # accept anything, and codesign --verify accepts ad-hoc signatures.
        # Squirrel.Mac matches every future update against this team, so a
        # certificate from any other team must never publish as latest.
        shell: bash
        env:
          EXPECTED_TEAM_ID: 4WDT6B6JDX
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(release/*.zip)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "Expected one zip in release/, found ${#zips[@]}." >&2
            exit 1
          fi
          unpacked="$RUNNER_TEMP/verify-app"
          ditto -x -k "${zips[0]}" "$unpacked"
          apps=("$unpacked"/*.app)
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          signer=$(codesign -dv "${apps[0]}" 2>&1)
          echo "$signer"
          if ! grep -qx "TeamIdentifier=$EXPECTED_TEAM_ID" <<<"$signer"; then
            echo "App is not signed by team $EXPECTED_TEAM_ID." >&2
            exit 1
          fi
          # Ephemeral runner; make sure the assessment is real, not an override.
          sudo spctl --master-enable
          assessment=$(spctl --assess --type execute --verbose=4 "${apps[0]}" 2>&1)
          echo "$assessment"
          if ! grep -q "source=Notarized Developer ID" <<<"$assessment"; then
            echo "Gatekeeper did not report a notarized Developer ID app." >&2
            exit 1
          fi
          xcrun stapler validate "${apps[0]}"

      - name: Launch isolation check
        # The gate is a real script, not YAML prose: shellcheck-able, runnable
        # locally against any artifacts directory, and guardable as code. It
        # launches the DMG's bundle against a scratch HOME and refuses to let
        # the release publish unless everything the app creates is fork-owned.
        # Never skipped — dry runs exist to exercise exactly this step.
        # The script is shellcheck'd by CI's release_smoke job on every PR —
        # linting a static, already-committed file behind a 30-minute build
        # (on the one runner tier without shellcheck preinstalled) is how a
        # two-character oversight burned a full dry run.
        shell: bash
        run: bash .github/scripts/launch-isolation-check.sh release

      - name: Collect release assets
        # A dry run exercises the build and the launch isolation gate without
        # publishing anything — the gate can only be tested by running it, and
        # iterating on it must not cost a version number per attempt.
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          # builder-debug.yml is build diagnostics, not an updater manifest —
          # shipping it would put a confusing file in the release.
          rm -f release-publish/builder-debug.yml
          ls -lh release-publish

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: no3y Code ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          # `inputs.prerelease` is already a boolean for a typed dispatch
          # input, so negate it directly — fromJSON() here would be handed a
          # boolean where it expects a string.
          make_latest: ${{ !inputs.prerelease }}
          files: |
            release-publish/*.dmg
            release-publish/*.zip
            release-publish/*.blockmap
            release-publish/*.yml
          fail_on_unmatched_files: true
          # The upgrade warnings below are durable: they ride every release
          # body because the hazards they describe fire on any version jump,
          # not just the release that introduced them. Drop the prompt-stash
          # stanza only when installs at v0.1.5 or earlier no longer matter.
          body: |
            Signed and notarized macOS arm64 build of this fork, built from `${{ github.sha }}`.

            Signed installs update themselves: an update notice appears in the
            sidebar, or check from Settings → General → About. If your
            installed copy predates signing (it needed the quarantine
            workaround), download this DMG and replace
            `"/Applications/no3y Code.app"` once by hand; it opens normally
            and updates in place from then on.

            no3y Code keeps all state in its own `~/.t3-fork` and never touches
            the real T3 Code app's `~/.t3`. First launch therefore starts from
            an empty environment — no projects, no sign-in.

            If you installed v0.1.1 ("T3 Code Fork.app"): delete that app and
            do not launch it again — it shared the real app's `~/.t3/userdata`
            database and left an orphaned `~/.t3/userdata-fork` directory you
            can also delete. Details: `.fork/notes/FORK-DATA-ISOLATION-HANDOFF.md`.

            If you are upgrading from v0.1.5 or earlier: prompt stashes saved
            by those versions are deleted on first launch. v0.1.6 moved the
            stash to a new storage key and unconditionally purges the old one,
            so copy anything you need out of the prompt stash before upgrading.
            Details: the [v0.1.6 release notes](https://github.com/NoahHendrickson/t3code/releases/tag/v0.1.6).

            T3 Connect (remote access and sign-in) is configured with the same
            public values as official T3 Code releases and uses upstream's
            hosted relay. Everything local works without signing in, as always.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
