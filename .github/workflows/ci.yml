name: CI

on:
  pull_request:
  push:
    branches:
      # fork:begin ci-on-custom — see .fork/customizations.yaml#ci-on-custom
      # `main` is deliberately absent on the fork: it is a pure upstream
      # mirror whose commits upstream CI has already validated, and mirror
      # pushes authenticate with a deploy key, which — unlike GITHUB_TOKEN —
      # triggers `push` workflows.
      - custom
      # fork:end ci-on-custom

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    # fork:begin ci-runners — see .fork/customizations.yaml#ci-runners
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # fork:end ci-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      # fork:begin fork-lint-cleanliness — see .fork/customizations.yaml#fork-lint-cleanliness
      # `vp check` lints the whole repo but exits 0 on warnings, and no
      # --max-warnings is set anywhere, so fork-authored dead code accumulates
      # silently — it took three PRs to remove nine dead imports because
      # noticing was the hard part. This fails on a single warning in
      # fork-owned code only, so upstream's warnings can never turn it red.
      - name: Lint fork-owned code
        run: node .fork/lint-owned.mjs
      # fork:end fork-lint-cleanliness

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    # fork:begin ci-runners — see .fork/customizations.yaml#ci-runners
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # fork:end ci-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run test

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    # fork:begin ci-runners — see .fork/customizations.yaml#ci-runners
    runs-on: macos-latest
    timeout-minutes: 30
    # fork:end ci-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    # fork:begin ci-runners — see .fork/customizations.yaml#ci-runners
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # fork:end ci-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

      # fork:begin fork-desktop-release — see .fork/customizations.yaml#fork-desktop-release
      # The launch isolation gate script only otherwise executes inside a
      # release dispatch, after a ~30-minute build — a lint defect there costs
      # a full build to discover (it happened: the first dry run died on the
      # gate step before launching anything). Lint it here instead, where
      # shellcheck is preinstalled and every PR pays seconds, not a build.
      - name: Lint release scripts
        run: shellcheck .github/scripts/launch-isolation-check.sh
      # fork:end fork-desktop-release
